<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="32x32" href="assets/epc-icon-32.png?v=20261024-brand46"><link rel="apple-touch-icon" sizes="180x180" href="assets/epc-icon-180.png?v=20261024-brand46"><meta name="apple-mobile-web-app-title" content="EPC"><link rel="stylesheet" href="brand.css?v=20261024-brand46"><title>EPC 獨立計時器管理</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#090909;color:#eee;font:16px system-ui,'Noto Sans TC',sans-serif}h1,h2,h3{color:#e9c568}h1{font-size:25px;margin:0}h2{font-size:21px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}p,.small{color:#bfbfbf;font-size:14px;line-height:1.7}label{display:block;font-size:14px;margin:14px 0 6px}button,input,select,textarea{font:inherit;border:1px solid #66502b;border-radius:7px;padding:9px;color:white;background:#101010}input,select,textarea{width:100%}button{cursor:pointer}.primary{background:#d2ad50;color:#080808;font-weight:700}button:disabled,input:disabled,select:disabled,textarea:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.card{border:1px solid #514322;background:#111;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}#message{color:#f2d58c;min-height:25px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;text-align:left;border-bottom:1px solid #333}th{color:#e9c568}.levelrow{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr)) 80px 40px;gap:6px;align-items:center;margin:7px 0}.levelrow input{padding:8px 5px}.muted{color:#aaa}#levelRows{max-height:430px;overflow:auto}dialog{width:98vw;max-width:none;height:96vh;max-height:none;padding:0;border:1px solid #b89340;border-radius:12px;background:#050505;color:#eee}dialog .toolbar{justify-content:space-between;padding:8px 16px;height:48px}iframe{width:100%;height:calc(100% - 52px);border:0}[hidden]{display:none!important}.tabs{margin-top:20px}.tabs button[aria-selected=true]{border-color:#e9c568;color:#e9c568}@media(max-width:800px){body{padding:12px}.grid{grid-template-columns:1fr}.levelrow{grid-template-columns:26px repeat(3,minmax(0,1fr)) 60px 32px;gap:3px}.levelrow input{font-size:13px}table{font-size:13px}}
</style><link rel="stylesheet" href="timer-appearance.css?v=20261023-tablet-rgb41"></head><body><header><img class="epc-brand-logo" src="assets/epc-brand.png?v=20261024-brand46" alt="EPC 原版 LOGO" width="128" height="58"><h1>計時器</h1><span class="small" id="mode"></span></header><p>先在這裡建立計時器範本，再到「賽事管理」選擇範本；建立賽事時會同時產生該場計時器。</p><p id="message" role="status">正在連線…</p><div class="toolbar tabs"><button id="templatesTab" aria-selected="true">計時器範本</button><button id="timersTab" aria-selected="false">計時器列表</button></div>
<section id="templatePanel" class="grid"><aside class="card"><h2>共用範本</h2><label for="templatePicker">選擇範本</label><select id="templatePicker"><option value="standard">20 分鐘標準賽（內建）</option></select><div class="toolbar" style="margin-top:16px"><button id="newTemplate">＋新增範本</button><button id="previewTemplate">預覽計時器</button></div><p>範本包含盲注、每級時間、休息、起始籌碼、預設公告及獎勵說明。</p><p>儲存範本不會改動已建立的賽事計時器。</p><section id="demoCreate" hidden><h3>建立流程練習</h3><label for="demoTemplate">賽事選用的計時器範本</label><select id="demoTemplate"></select><button id="simulateCreate" class="primary" style="margin-top:12px">模擬建立賽事與計時器</button><p>只使用練習資料，不會建立正式賽事。</p></section></aside>
<div class="card"><h2 id="editorTitle">範本設定</h2><div class="row"><div><label for="templateName">範本名稱</label><input id="templateName" data-write></div><div><label for="startingStack">起始籌碼／組</label><input id="startingStack" type="number" min="1" step="1" value="300000" data-write></div></div><label for="background">計時器背景</label><select id="background" data-write><option value="classic">原始深黑</option><option value="black-gold">經典黑金撲克</option><option value="light">黑金光影</option><option value="emerald">暗綠賭桌</option><option value="velvet">酒紅絲絨</option></select><div id="appearanceEditor"></div><p class="small">級別／小盲／大盲／Ante／分鐘</p><div id="levelRows"></div><div class="toolbar"><button id="addLevel" data-write>＋級別</button><button id="addBreak" data-write>＋休息</button></div><div class="row"><div><label for="announcement">預設公告</label><textarea id="announcement" rows="4" data-write></textarea></div><div><label for="payoutInput">預設名次／獎勵</label><textarea id="payoutInput" rows="4" data-write></textarea></div></div><button id="saveTemplate" class="primary" data-write style="margin-top:16px">儲存新範本</button></div></section>
<section id="timerPanel" class="card" hidden><h2>各場計時器</h2><p>由賽事建立時自動產生；這裡集中控制時間、公告與本場盲注。</p><div style="overflow:auto"><table><thead><tr><th>賽事</th><th>使用範本</th><th>狀態</th><th>剩餘時間</th><th>操作</th></tr></thead><tbody id="timerRows"></tbody></table></div></section>
<dialog id="controlDialog"><div class="toolbar"><b>計時器控制</b><button id="closeControl">關閉</button></div><iframe id="controlFrame" title="計時器控制後臺"></iframe></dialog><dialog id="templatePreviewDialog"><div class="toolbar"><b>預覽計時器</b><button id="closeTemplatePreview">關閉</button></div><iframe allow="autoplay" id="templatePreviewFrame" title="範本計時器預覽" style="height:calc(100% - 90px)"></iframe><p class="small" style="padding:0 16px;margin:4px 0">僅供預覽，畫面不會傳送到設備。正式投影請至「顯示設備」。</p></dialog><script src="firebase-config.js"></script><script type="module" src="timer-manager.js?v=20261024-audio-unlock2"></script></body></html>
