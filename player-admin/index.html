<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 玩家服務管理</title><link rel="stylesheet" href="../player/style.css?v=1"><link rel="icon" href="../assets/epc-icon-32.png?v=46"></head><body><header class="top"><img src="../assets/epc-brand.png?v=46" alt="EPC LOGO"><div><strong>PLAYER ADMIN</strong><span>會員綁定與福利管理</span></div></header><main><div class="eyebrow">EPC BACK OFFICE</div><h1>玩家服務管理</h1><p id="status" class="notice" role="status">正式會員服務尚未部署，以下為待啟用的管理介面。</p><button id="login" class="full-button">Google 管理員登入</button><button id="logout" class="text-button" hidden>登出</button><fieldset id="controls" disabled style="border:0;padding:0;margin-top:24px"><section class="card"><h2>綁定玩家會員</h2><p class="small">須當面核對玩家 Google 帳號與 EPC 會員身分。綁定後該帳號可查閱指定會員的個人資料。</p><form id="bind"><label>玩家提供的六位綁定碼<input name="code" inputmode="numeric" pattern="[0-9]{6}" required></label><label>會員編號<input name="memberId" required></label><label>會員綽號<input name="nickname" required></label><label style="display:flex;gap:8px;margin-top:13px"><input name="identityConfirmed" type="checkbox" required style="width:auto">已當面核對會員本人與登入帳號</label><button class="full-button" type="submit">確認綁定</button></form></section><section class="card" style="margin-top:17px"><h2>發放優惠券</h2><form id="coupon"><label>已綁定會員編號<input name="memberId" required></label><label>優惠名稱<input name="name" required maxlength="100"></label><div class="filter"><label>折抵金額<input name="amount" type="number" min="1" step="1" required></label><label>有效期限<input name="expiresOn" type="date" required></label></div><label>使用條件<input name="terms" required maxlength="1000"></label><button class="full-button" type="submit">發放優惠券</button></form></section><section class="card" style="margin-top:17px"><h2>會員點數異動</h2><form id="points"><label>已綁定會員編號<input name="memberId" required></label><label>異動點數（扣除請填負數）<input name="delta" type="number" step="1" required></label><label>異動原因<input name="label" required maxlength="100"></label><button class="full-button" type="submit">記錄點數異動</button></form></section><section class="card" style="margin-top:17px"><h2>核銷優惠券</h2><form id="redeemCoupon"><label>已綁定會員編號<input name="memberId" required></label><label>優惠券編號<input name="couponId" required></label><button class="full-button secondary" type="submit">確認已使用，核銷本券</button></form></section></fieldset><p class="small">發券、點數與核銷均記錄管理員與操作識別碼。玩家無法自行修改點數或優惠券狀態。</p></main><script src="../firebase-config.js"></script><script type="module" src="app.js?v=1"></script></body></html>
