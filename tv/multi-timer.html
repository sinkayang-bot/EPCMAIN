<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 多計時器</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;color:#e7c77e;font-family:Arial,'Noto Sans TC',sans-serif}#grid{display:grid;width:100vw;height:100vh;gap:6px;padding:6px;background:#05080b;grid-template-columns:1fr;grid-template-rows:1fr}#grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}#grid.four{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.cell{position:relative;min-width:0;min-height:0;overflow:hidden;background:#080e15;border:1px solid #8e6936;border-radius:6px}.cell iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:top left;pointer-events:auto}.empty{display:grid;place-items:center;color:#e7c77e;font-size:24px}</style></head><body><main id="grid"></main><script>const params=new URLSearchParams(location.search),ids=[...new Set((params.get('ids')||'').split(',').map(x=>x.trim()).filter(Boolean))].slice(0,4),grid=document.getElementById('grid');if(!ids.length)grid.innerHTML='<div class="empty">請從 EPC 顯示設備選擇賽事</div>';else{grid.className=ids.length===1?'':ids.length===2?'two':'four';ids.forEach(id=>{const cell=document.createElement('section');cell.className='cell';const frame=document.createElement('iframe');frame.title='EPC 賽事 '+id;frame.allow='autoplay';frame.src='../timer.html?eventId='+encodeURIComponent(id)+'&v=20261028-multi1';cell.append(frame);grid.append(cell)});function fit(){grid.querySelectorAll('.cell').forEach(cell=>{const frame=cell.firstElementChild,w=cell.clientWidth,h=cell.clientHeight;const scale=Math.min(w/1920,h/1080);frame.style.transform='scale('+scale+')';frame.style.left=(w-1920*scale)/2+'px';frame.style.top=(h-1080*scale)/2+'px'})}addEventListener('resize',fit);new ResizeObserver(fit).observe(grid);fit()}</script></body></html>
