<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 顯示設備</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-size:clamp(20px,1.35vw,28px);margin:0;background:#0d1015;color:#f3f4f6;font-family:system-ui,"Microsoft JhengHei",sans-serif}main{padding:4vh 5vw;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #454039;padding-bottom:2vh;color:#d8b65f}h1{font-size:clamp(28px,3vw,60px);margin:1vh 0}h2{font-size:clamp(24px,2.5vw,48px)}.center{text-align:center;padding:10vh 0}.code{font-size:clamp(70px,12vw,180px);letter-spacing:.12em;color:#dfbd68;font-weight:800}.muted{color:#aab3c1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw}.card{border:1px solid #42464f;background:#1b2028;border-radius:16px;padding:2vw}.value{font-size:clamp(32px,4vw,80px);font-weight:800;color:#e3c36d}.hp{height:3vh;background:#343a43;border-radius:20px;overflow:hidden}.hp>div{height:100%;background:#d5b05c}table{width:100%;border-collapse:collapse;font-size:clamp(20px,2vw,38px)}td,th{padding:1.3vh 1vw;text-align:left;border-bottom:1px solid #343a43}th{color:#bdc6d4;font-size:.9em;font-weight:700}.badge{font-size:clamp(22px,2vw,40px);color:#dfbd68}footer{margin-top:2vh;color:#bdc6d4;font-size:clamp(18px,1.25vw,26px);line-height:1.5}.error{color:#ff9b9b}@media(max-width:650px){.grid{grid-template-columns:1fr}.value{font-size:36px}}

header>span{font-size:clamp(20px,1.35vw,28px);font-weight:600}
.boss-metrics{grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4vw}
.boss-metrics .card{padding:1.5vw;border-radius:18px;border-top:3px solid #c7a85f;background:linear-gradient(145deg,#222832,#171c24);min-height:190px}
.metric-label{font-size:clamp(24px,1.7vw,36px);font-weight:750;color:#f3f4f6;letter-spacing:.04em}
.boss-metrics .value{font-size:clamp(38px,3.4vw,72px);line-height:1.15;margin:14px 0;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.03em}
.metric-note{font-size:clamp(20px,1.35vw,28px);color:#bdc6d4;line-height:1.55}
.hp-total{font-size:.55em;color:#bdc6d4;letter-spacing:0}
.boss-metrics .hp{height:18px;margin-top:18px}
@media(max-width:1100px){.boss-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.boss-metrics .card{padding:24px}.boss-metrics .value{font-size:48px}}
@media(max-width:650px){.boss-metrics{grid-template-columns:1fr}.boss-metrics .value{font-size:44px}}

main.parallel-screen{height:100vh;min-height:0;padding:1.5vh 1.5vw;display:grid;grid-template-columns:repeat(var(--panel-columns),minmax(0,1fr));grid-template-rows:repeat(var(--panel-rows),minmax(0,1fr));gap:1.5vh 1.2vw}
.activity-panel{min-width:0;min-height:0;overflow:auto;background:#141920;border:1px solid #514735;border-radius:16px;padding:1.2vh 1vw}
.activity-panel header{display:block;padding-bottom:.7vh}.activity-panel h1{font-size:clamp(20px,1.7vw,36px);margin:.4vh 0}.activity-panel header>span{font-size:clamp(12px,1vw,20px)}
.activity-panel h2{font-size:clamp(16px,1.3vw,28px);margin:1vh 0}.activity-panel .badge{font-size:clamp(12px,1vw,20px)}
.activity-panel table{font-size:clamp(14px,1.3vw,28px)!important;table-layout:fixed}.activity-panel td,.activity-panel th{padding:.65vh .3vw;overflow-wrap:anywhere}
.activity-panel .boss-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7vh .6vw}.activity-panel .boss-metrics .card{padding:.7vh .6vw;min-height:0;border-radius:10px}
.activity-panel .metric-label{font-size:clamp(14px,1vw,22px)}.activity-panel .boss-metrics .value{font-size:clamp(22px,2vw,42px);margin:.5vh 0}.activity-panel .metric-note{font-size:clamp(12px,.85vw,18px);line-height:1.3}.activity-panel .boss-metrics .hp{height:10px;margin-top:.5vh}
.activity-panel footer{font-size:clamp(11px,.8vw,16px);margin-top:.8vh;line-height:1.35}

.activity-panel.boss-panel{overflow:hidden}
.boss-panel-content{transform-origin:center top;display:grid;grid-template-columns:1.15fr 1fr;gap:.7vh 1vw}
.boss-panel-content>header,.boss-panel-content>h2:first-of-type,.boss-panel-content>footer{grid-column:1/-1}
.boss-panel-content>.boss-metrics{grid-column:1;grid-row:3/span 2;align-content:start}
.boss-panel-content>h2:nth-of-type(2){grid-column:2;grid-row:3;margin:0}
.boss-panel-content>table{grid-column:2;grid-row:4;align-self:start}
.boss-panel-content>footer{margin-top:0}

.activity-panel .leaderboard .col-rank{width:12%}
.activity-panel .leaderboard .col-score,.activity-panel .leaderboard .col-count{width:14%}
.activity-panel .leaderboard .player-identity{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal}
.activity-panel .leaderboard td:last-child,.activity-panel .leaderboard th:last-child{text-align:right}
</style><main id="screen"><div class="center"><h1>EPC 顯示設備</h1><p>正在連線…</p></div></main><script src="../firebase-config.js"></script><script type="module" src="./screen.js?v=20261009-player-column-width"></script></html>
