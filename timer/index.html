<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 計時器測試版</title><style>body{margin:0;background:#0c1420;color:#eef4fb;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:960px;margin:auto;padding:24px}.panel{background:#182638;border:1px solid #34475d;border-radius:16px;padding:22px;margin:14px 0}h1{font-size:28px}.clock{font-size:clamp(70px,15vw,150px);font-variant-numeric:tabular-nums;text-align:center;font-weight:800;color:#f2c77e}.level{text-align:center;font-size:34px;font-weight:800}.info{text-align:center;font-size:24px;margin:12px}button,input,textarea{font:inherit;border-radius:9px;padding:12px;border:1px solid #63738a}button{cursor:pointer;background:#30465f;color:white}button.primary{background:#b58b42;color:#101824;font-weight:800}button.danger{background:#6b3038}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}textarea{width:100%;box-sizing:border-box;min-height:125px;background:#0d1826;color:white}small{color:#aebdd0}#status{text-align:center;color:#d5dce8}label{display:block;margin:8px 0}</style></head><body><main><h1>EPC 賽事計時器 <small>獨立測試版</small></h1><div class="panel"><div id="level" class="level"></div><div id="clock" class="clock">--:--</div><div id="blinds" class="info"></div><div id="next" class="info"></div><div id="status"></div><div class="controls"><button class="primary" id="toggle">開始</button><button id="prev">上一級</button><button id="nextBtn">下一級</button><button id="minus">-1 分鐘</button><button id="plus">+1 分鐘</button><button class="danger" id="reset">重置</button></div></div><div class="panel"><h2>盲注結構</h2><small>每行：小盲,大盲,前注,分鐘；休息請輸入 BREAK,分鐘。修改結構不會重設目前剩餘時間。</small><textarea id="structure"></textarea><div class="controls"><button id="apply">套用結構</button><button id="defaults">恢復預設結構</button></div></div><p><small>此頁為獨立功能測試，不連接正式賽事、Firebase 或帳務資料。測試設定只儲存在目前瀏覽器。</small></p></main><script>
(()=>{'use strict';const key='epc-timer-prototype-v1';const defaults='100,200,200,15\n200,400,400,15\n300,600,600,15\nBREAK,5\n400,800,800,15\n500,1000,1000,15';const $=id=>document.getElementById(id);const parse=t=>t.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const a=line.split(',').map(x=>x.trim());if(a[0].toUpperCase()==='BREAK'){const min=Number(a[1]);if(!(min>0&&min<=240))throw Error('休息分鐘錯誤：'+line);return{break:true,minutes:min}}const [sb,bb,ante,min]=a.map(Number);if(![sb,bb,ante,min].every(Number.isFinite)||sb<0||bb<=0||ante<0||min<=0||min>240)throw Error('盲注格式錯誤：'+line);return{sb,bb,ante,minutes:min}});let levels=parse(defaults);let state={index:0,remaining:levels[0].minutes*60000,running:false,endAt:null};try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Array.isArray(saved.levels)&&saved.levels.length&&saved.state){levels=saved.levels;state=saved.state}}catch(e){}const fmt=ms=>{const sec=Math.ceil(Math.max(0,ms)/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')};const duration=i=>levels[i].minutes*60000;const remaining=()=>state.running?Math.max(0,state.endAt-Date.now()):Math.max(0,state.remaining);function persist(){try{localStorage.setItem(key,JSON.stringify({levels,state}))}catch(e){}}function advance(){let rem=remaining();if(!state.running)return;let guard=0;while(rem<=0&&state.index<levels.length-1&&guard++<levels.length){const overshoot=Math.max(0,Date.now()-state.endAt);state.index++;state.endAt=Date.now()+duration(state.index)-overshoot;rem=remaining()}if(rem<=0){state.running=false;state.remaining=0;state.endAt=null}persist()}function render(){advance();const l=levels[state.index];$('level').textContent=l.break?'休息時間':'LEVEL '+(state.index+1);$('clock').textContent=fmt(remaining());$('blinds').textContent=l.break?'BREAK':('盲注 '+l.sb+' / '+l.bb+'　ANTE '+l.ante);const n=levels[state.index+1];$('next').textContent=n?'下一級：'+(n.break?'BREAK '+n.minutes+' 分鐘':n.sb+' / '+n.bb+' ANTE '+n.ante):'最後一級';$('status').textContent=state.running?'● 計時中':remaining()===0?'賽事時間結束':'● 已暫停';$('toggle').textContent=state.running?'暫停':'開始';}function jump(i){if(i<0||i>=levels.length)return;const was=state.running;state.index=i;state.remaining=duration(i);state.endAt=was?Date.now()+state.remaining:null;persist();render()}$('toggle').onclick=()=>{if(state.running){state.remaining=remaining();state.running=false;state.endAt=null}else{if(remaining()<=0)return;state.running=true;state.endAt=Date.now()+state.remaining}persist();render()};$('prev').onclick=()=>jump(state.index-1);$('nextBtn').onclick=()=>jump(state.index+1);function adjust(delta){const v=Math.max(0,remaining()+delta);state.remaining=v;if(state.running)state.endAt=Date.now()+v;persist();render()}$('minus').onclick=()=>adjust(-60000);$('plus').onclick=()=>adjust(60000);$('reset').onclick=()=>{if(!confirm('確定要重置計時器嗎？這會清除目前倒數進度。'))return;if(!confirm('再次確認：將回到第一個 LEVEL，並停止計時。確定執行？'))return;state={index:0,remaining:duration(0),running:false,endAt:null};persist();render()};const toText=()=>levels.map(l=>l.break?'BREAK,'+l.minutes:[l.sb,l.bb,l.ante,l.minutes].join(',')).join('\n');$('structure').value=toText();$('apply').onclick=()=>{try{const next=parse($('structure').value);if(!next.length)throw Error('至少需要一個 LEVEL');const rem=remaining();levels=next;state.index=Math.min(state.index,levels.length-1);state.remaining=rem;if(state.running)state.endAt=Date.now()+rem;persist();render();alert('盲注結構已套用，倒數進度保留')}catch(e){alert(e.message)}};$('defaults').onclick=()=>{$('structure').value=defaults};render();setInterval(render,250)})();
</script></body></html>
