</style></head><body><header><h1>EPC · TOURNAMENT CLOCK <span class="small">獨立測試版 V0.3</span></h1><div class="row"><span class="small">獨立測試資料</span><button onclick="toggleProjector()">1920×1080 投影預覽</button></div></header><main><div class="grid"><div class="editor">
<section class="card"><h2>賽事與計時器</h2><label for="events">選擇測試賽事</label><select id="events"></select><div class="row"><button onclick="createEvent()">＋建立賽事與計時器</button><button class="danger" onclick="deleteEvent()">刪除賽事</button></div><button style="margin-top:10px;width:100%" onclick="createReferenceEvent()">＋新增示意圖測試資料</button><label for="eventName">賽事名稱</label><input id="eventName" placeholder="賽事名稱" onchange="renameEvent()"><label for="templates">選擇盲注範本</label><select id="templates"></select><div class="row"><button onclick="applyTemplate()">套用範本到本場</button><button onclick="saveTemplate()">儲存目前結構為新範本</button></div></section>
<section class="card"><h2>盲注結構</h2><div class="levels" id="levelRows"></div><div class="row"><button onclick="addLevel()">＋新增級別</button><button onclick="addBreak()">＋休息</button></div><p class="small">欄位依序：級別、SB、BB、Ante、分鐘、刪除。休息列的盲注欄位留空。</p></section>
<section class="card"><h2>後台即時控制</h2><div class="row"><button class="gold" onclick="toggleRun()" id="playBtn">▶ 開始</button><button onclick="shiftTime(-60)">－1 分鐘</button><button onclick="shiftTime(60)">＋1 分鐘</button></div><div class="row"><button onclick="changeLevel(-1)">上一級</button><button onclick="changeLevel(1)">下一級</button><button onclick="resetLevel()">重設本級時間</button></div><label>指定剩餘秒數</label><div class="row"><input type="number" id="setSeconds" min="0" value="1200"><button onclick="setRemaining()">設定</button></div></section>
<section class="card"><h2>參賽與公告（測試資料）</h2><div class="row"><div><label for="players">參賽人數</label><input id="players" type="number" min="0" onchange="updateStats()"></div><div><label for="rebuyPlayers">重買人數</label><input id="rebuyPlayers" type="number" min="0" onchange="updateStats()"></div><div><label for="groups">總組數</label><input id="groups" type="number" min="0" onchange="updateStats()"></div></div><label for="mode">右側顯示模式</label><select id="mode" onchange="updateStats()"><option value="prize">獎池</option><option value="notice">不顯示獎池</option></select><label for="unit">每組獎池金額（0 代表不自動計算）</label><input id="unit" type="number" min="0" onchange="updateStats()"><label for="payoutInput">名次獎勵（每行：名次,金額）</label><textarea id="payoutInput" rows="4" placeholder="1,40000&#10;2,28000&#10;3,18000" oninput="updateStats()"></textarea><label for="startingStack">每組起始籌碼</label><input id="startingStack" type="number" min="0" value="0" onchange="updateStats()"><label for="announcement">場內公告（投影下方中央即時顯示）</label><textarea id="announcement" rows="3" oninput="updateStats()"></textarea><p class="small">正式整合時這些統計將從 EPC 賽事讀取；此頁先用測試值模擬。</p></section>
</div><div class="previewViewport" id="previewViewport"><section class="screen" id="broadcastScreen" aria-label="EPC 賽事計時器"><div class="artLayer">
<div class="live eventTitle" id="screenEvent" data-reference="EPC #3 3400限時錦標賽"></div>
<div class="live screenMeta" id="screenDate" data-reference="2026-10-12 14:32"></div>
<div class="live levelMeta" id="screenLevel" data-reference="LEVEL 4 / 20"></div>
<div class="live blindValue" id="curSB" data-reference="500"></div><div class="live blindValue" id="curBB" data-reference="1,000"></div><div class="live blindValue" id="curAnte" data-reference="1,000"></div>
<div class="live blindValue" id="nextSB" data-reference="1,000"></div><div class="live blindValue" id="nextBB" data-reference="1,500"></div><div class="live blindValue" id="nextAnte" data-reference="1,500"></div>
<div class="dial" id="progressRing"><div class="dynamicRing"><div class="ringTicks" id="ringTicks"></div></div></div>
<div class="live roundLabel" id="levelTitle" data-reference="LEVEL 4"></div><div class="live timer" id="clock" data-reference="12:35"></div>
<div class="live breakCaption" id="breakCaption">NEXT BREAK IN</div><div class="live breakNumber" id="breakCountdown" data-reference="01:12:35"></div>
<div class="live statValue" id="sPlayers" data-reference="28"></div><div class="live statValue" id="sRebuys" data-reference="16"></div><div class="live statValue" id="sGroups" data-reference="44"></div>
<div class="live chipValue" id="chipsInPlay" data-reference="1,320,000"></div><div class="live chipValue" id="avgStack" data-reference="30,000"></div>
<div class="live announcementText" id="announcementDisplay" data-reference="請各位選手注意時間"></div><div class="live noticeBreak" id="noticeBreak" data-reference="下一個休息時間為 01:12:35"></div>
<div class="live poolAmount" id="extraContent" data-reference="$132,000"></div><div class="payouts" id="payoutDisplay" role="table" aria-label="名次獎勵"></div>
<div class="clockStatus" id="status" aria-live="off"></div>
<div class="screenControls"><button onclick="toggleProjector()">⛶ 全螢幕 / 返回</button><button onclick="toggleRun()">開始 / 暫停</button></div>
</div></section></div></div></main><script>
const KEY='epc-timer-prototype-v1';const base=[{sb:100,bb:200,ante:200,min:20},{sb:200,bb:400,ante:400,min:20},{sb:300,bb:600,ante:600,min:20},{sb:500,bb:1000,ante:1000,min:20},{break:true,min:5},{sb:1000,bb:1500,ante:1500,min:20},{sb:1000,bb:2000,ante:2000,min:20}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.events))state={templates:[{id:'standard',name:'20分鐘標準賽',levels:base}],events:[],selected:null};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const current=()=>state.events.find(e=>e.id===state.selected);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function newEvent(name){return{id:'E'+Date.now()+Math.random().toString(36).slice(2,5),name,levels:structuredClone(base),index:0,remaining:1200,running:false,players:0,rebuyPlayers:0,groups:0,unit:0,mode:'notice',announcement:'歡迎參加 EPC 限時錦標賽',payoutInput:'',startingStack:0}}
function createReferenceEvent(){
 const e=newEvent('EPC #3 3400限時錦標賽');
 e.index=3;e.remaining=755;e.players=28;e.rebuyPlayers=16;e.groups=44;e.unit=3000;e.startingStack=30000;e.mode='prize';
 e.announcement='請各位選手注意時間';
 e.payoutInput='1,40000\n2,28000\n3,18000\n4,12000\n5,8000';
 e.levels=[...structuredClone(base.slice(0,4)),...structuredClone(base.slice(5)),{sb:1500,bb:3000,ante:3000,min:20},{break:true,min:5},...Array.from({length:13},(_,i)=>({sb:2000+i*1000,bb:4000+i*2000,ante:4000+i*2000,min:20}))];
 state.events.push(e);state.selected=e.id;save();render();return e;
}
function createEvent(){const name=prompt('測試賽事名稱','EPC 測試賽事');if(!name)return;const e=newEvent(name);const t=state.templates.find(x=>x.id===$('templates').value);if(t)e.levels=structuredClone(t.levels);e.remaining=e.levels[0].min*60;state.events.push(e);state.selected=e.id;save();render()}
function deleteEvent(){const e=current();if(!e||!confirm('刪除「'+e.name+'」與其測試計時器？範本會保留。'))return;state.events=state.events.filter(x=>x.id!==e.id);state.selected=state.events[0]?.id||null;save();render()}
function renameEvent(){const e=current();if(e){e.name=$('eventName').value;save();render()}}
function saveTemplate(){const e=current();if(!e)return;const name=prompt('新範本名稱','我的盲注結構');if(!name)return;state.templates.push({id:'T'+Date.now(),name,levels:structuredClone(e.levels)});save();render()}
function applyTemplate(){const e=current(),t=state.templates.find(x=>x.id===$('templates').value);if(!e||!t)return;if(!confirm('套用範本將重設此計時器的級別和剩餘時間，確定？'))return;e.levels=structuredClone(t.levels);e.index=0;e.remaining=e.levels[0].min*60;e.running=false;save();render()}
function render(){const e=current();$('events').innerHTML=state.events.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');$('events').value=state.selected||'';$('templates').innerHTML=state.templates.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('');$('eventName').value=e?.name||'';for(const id of ['players','rebuyPlayers','groups','unit','announcement','mode','payoutInput','startingStack'])$(id).value=e?.[id]??'';renderLevels();renderScreen()}
function renderLevels(){const e=current();$('levelRows').innerHTML=e?e.levels.map((l,i)=>'<div class="levelrow"><span>'+(l.break?'休':i+1)+'</span><input aria-label="SB" type="number" placeholder="SB" '+(l.break?'disabled':'')+' value="'+(l.sb??'')+'" onchange="editLevel('+i+',\'sb\',this.value)"><input aria-label="BB" type="number" placeholder="BB" '+(l.break?'disabled':'')+' value="'+(l.bb??'')+'" onchange="editLevel('+i+',\'bb\',this.value)"><input aria-label="Ante" type="number" placeholder="Ante" '+(l.break?'disabled':'')+' value="'+(l.ante??'')+'" onchange="editLevel('+i+',\'ante\',this.value)"><input aria-label="分鐘" type="number" min="1" value="'+l.min+'" onchange="editLevel('+i+',\'min\',this.value)"><button onclick="removeLevel('+i+')">×</button></div>').join(''):'請建立測試賽事'}
function editLevel(i,k,v){const e=current();if(!e)return;e.levels[i][k]=Math.max(k==='min'?1:0,Number(v)||0);save();renderScreen()}
function addLevel(){const e=current();if(!e)return;e.levels.push({sb:1000,bb:2000,ante:2000,min:20});save();renderLevels();renderScreen()}
function addBreak(){const e=current();if(!e)return;e.levels.push({break:true,min:5});save();renderLevels();renderScreen()}
function removeLevel(i){const e=current();if(!e||e.levels.length===1)return;e.levels.splice(i,1);e.index=Math.min(e.index,e.levels.length-1);e.remaining=e.levels[e.index].min*60;save();render()}
function toggleRun(){const e=current();if(!e)return;const wasRunning=e.running;advanceTimers();e.running=!wasRunning&&e.remaining>0;e.lastTick=Date.now();save();renderScreen()}
function changeLevel(d){const e=current();if(!e)return;e.index=Math.max(0,Math.min(e.levels.length-1,e.index+d));e.remaining=e.levels[e.index].min*60;e.lastTick=Date.now();save();renderScreen()}
function resetLevel(){const e=current();if(!e)return;e.remaining=e.levels[e.index].min*60;e.lastTick=Date.now();save();renderScreen()}
function shiftTime(n){const e=current();if(!e)return;advanceTimers();e.remaining=Math.max(0,e.remaining+n);e.lastTick=Date.now();save();renderScreen()}
function setRemaining(){const e=current();if(!e)return;e.remaining=Math.max(0,Math.floor(Number($('setSeconds').value)||0));e.lastTick=Date.now();save();renderScreen()}
function updateStats(){const e=current();if(!e)return;for(const id of ['players','rebuyPlayers','groups','unit','startingStack'])e[id]=Math.max(0,Number($(id).value)||0);e.mode=$('mode').value;e.announcement=$('announcement').value;e.payoutInput=$('payoutInput').value;save();renderScreen()}
function initRing(){const el=$('ringTicks');if(!el||el.children.length)return;for(let i=0;i<72;i++){const tick=document.createElement('i');tick.style.transform='rotate('+(i*5)+'deg) translateY(-216px)';tick.dataset.tick=i;el.appendChild(tick)}}

function referenceVisibility(){for(const node of document.querySelectorAll('[data-reference]'))node.classList.toggle('changed',node.textContent!==node.dataset.reference)}
function renderScreen(){
 initRing();const e=current();const num=v=>Math.max(0,Number(v)||0).toLocaleString('en-US');
 const clock=v=>{v=Math.max(0,Math.floor(v));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};
 const duration=v=>String(Math.floor(v/3600)).padStart(2,'0')+':'+clock(v%3600);
 if(!e){for(const node of document.querySelectorAll('[data-reference]'))node.textContent='—';$('screenEvent').textContent='請先建立測試賽事';$('payoutDisplay').replaceChildren();$('payoutDisplay').classList.add('changed');$('progressRing').classList.add('active');referenceVisibility();return}
 const l=e.levels[e.index],n=e.levels[e.index+1],level=e.levels.slice(0,e.index+1).filter(x=>!x.break).length;
 $('screenDate').textContent=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Taipei'}).slice(0,16);
 $('screenLevel').textContent='LEVEL '+level+' / '+e.levels.filter(x=>!x.break).length;
 $('screenEvent').textContent=e.name;$('levelTitle').textContent=l.break?'BREAK':'LEVEL '+level;$('clock').textContent=clock(e.remaining);
 $('status').textContent=e.running?'計時中':e.remaining===0?'本級結束，請切換下一級':'暫停 / 待開始';
 for(const [id,val] of [['curSB',l.break?'—':num(l.sb)],['curBB',l.break?'—':num(l.bb)],['curAnte',l.break?'—':num(l.ante)],['nextSB',!n?'—':n.break?'休息':num(n.sb)],['nextBB',!n||n.break?'—':num(n.bb)],['nextAnte',!n||n.break?'—':num(n.ante)]])$(id).textContent=val;
 $('sPlayers').textContent=num(e.players);$('sRebuys').textContent=num(e.rebuyPlayers);$('sGroups').textContent=num(e.groups);
 const chips=e.groups*(e.startingStack||0);$('chipsInPlay').textContent=e.startingStack?num(chips):'—';$('avgStack').textContent=e.startingStack&&e.players?num(Math.floor(chips/e.players)):'—';
 $('extraContent').textContent=e.mode==='prize'&&e.unit>0?'$'+num(e.groups*e.unit):'—';
 $('announcementDisplay').textContent=e.announcement||'暫無公告';
 const notice=$('announcementDisplay');notice.style.fontSize=((e.announcement||'').length>36?25:(e.announcement||'').length>20?34:45)+'px';
 $('payoutDisplay').replaceChildren();const lines=(e.payoutInput||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
 const originalPayout='1,40000|2,28000|3,18000|4,12000|5,8000';
 $('payoutDisplay').classList.toggle('changed',e.mode!=='prize'||lines.join('|')!==originalPayout);
 $('payoutDisplay').style.overflowY=lines.length>5?'auto':'hidden';$('payoutDisplay').style.pointerEvents=lines.length>5?'auto':'none';
 if(e.mode==='prize')for(const line of lines){const parts=line.split(',');const row=document.createElement('div');row.className='payoutRow';row.setAttribute('role','row');const rank=document.createElement('span');rank.textContent=parts[0]||'';const amount=document.createElement('span');amount.textContent=parts.length>1?'$'+num(parts.slice(1).join('')):'—';row.append(rank,amount);$('payoutDisplay').append(row)}
 const total=Math.max(1,Number(l.min||20)*60),pct=Math.max(0,Math.min(1,e.remaining/total));
 for(const tick of $('ringTicks').children)tick.classList.toggle('lit',Number(tick.dataset.tick)<Math.ceil(pct*72));
 $('progressRing').classList.toggle('active',e.remaining!==755||l.break||level!==4||l.min!==20);
 let until=0;for(let i=e.index;i<e.levels.length;i++){if(e.levels[i].break)break;until+=i===e.index?e.remaining:e.levels[i].min*60}
 const hasBreak=e.levels.slice(e.index).some(x=>x.break);
 $('breakCountdown').textContent=l.break?duration(e.remaining):hasBreak?duration(until):'—';$('breakCaption').textContent=l.break?'BREAK REMAINING':'NEXT BREAK IN';
 $('noticeBreak').textContent=l.break?'目前休息剩餘 '+duration(e.remaining):hasBreak?'下一個休息時間為 '+duration(until):'本場無後續休息';
 $('playBtn').textContent=e.running?'Ⅱ 暫停':'▶ 開始';referenceVisibility();
}
function fitScreen(){const v=$('previewViewport');if(!v)return;const full=document.body.classList.contains('projector');const native=document.body.classList.contains('native');const w=native?1920:full?innerWidth:v.clientWidth;const h=native?1080:full?innerHeight:w*1080/1920;v.style.height=h+'px';const scale=Math.min(w/1920,h/1080);const screen=$('broadcastScreen');screen.style.transform='translate('+((w-1920*scale)/2)+'px,'+((h-1080*scale)/2)+'px) scale('+scale+')'}
function toggleProjector(){const full=document.body.classList.toggle('projector');fitScreen();if(full)document.documentElement.requestFullscreen?.().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})}
addEventListener('resize',fitScreen);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('projector')&&!new URLSearchParams(location.search).has('projector'))document.body.classList.remove('projector');fitScreen()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){document.body.classList.remove('projector');fitScreen()}});

addEventListener('storage',ev=>{if(ev.key!==KEY||!ev.newValue)return;try{const incoming=JSON.parse(ev.newValue);if(!Array.isArray(incoming.events)||!Array.isArray(incoming.templates))return;state=incoming;render()}catch{}});
$('events').addEventListener('change',ev=>{state.selected=ev.target.value;save();render()});
function advanceTimers(now=Date.now()){
 let changed=false;
 for(const e of state.events){
  if(!e.running){e.lastTick=now;continue}
  const prev=Number.isFinite(e.lastTick)?e.lastTick:now;
  const elapsed=Math.max(0,Math.floor((now-prev)/1000));
  if(!elapsed){e.lastTick=prev;continue}
  e.lastTick=prev+elapsed*1000;e.remaining=Math.max(0,e.remaining-elapsed);changed=true;
  if(e.remaining===0)e.running=false;
 }
 if(changed){save();renderScreen()}
}
setInterval(()=>advanceTimers(),250);
document.addEventListener('visibilitychange',()=>{advanceTimers();fitScreen()});

if(!state.events.length)createReferenceEvent();render();if(new URLSearchParams(location.search).has('projector'))document.body.classList.add('projector');if(new URLSearchParams(location.search).has('native'))document.body.classList.add('native');fitScreen();new ResizeObserver(fitScreen).observe($('previewViewport'));
</script></body></html>
