<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 計時器測試版</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#edf2fa;background:#090e16}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#111b2a;border-bottom:1px solid #314057;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0;color:#e1be69}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;color:#e1be69}main{max-width:1380px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:18px}.card{background:#141e2c;border:1px solid #2b3c52;border-radius:14px;padding:18px;margin-bottom:16px}label{display:block;color:#aab8ca;font-size:13px;margin:10px 0 5px}input,select,textarea{background:#0a1320;color:white;border:1px solid #3a4b63;border-radius:7px;padding:10px;width:100%;font:inherit}button{background:#273950;color:white;border:1px solid #4b6079;border-radius:8px;padding:10px 13px;cursor:pointer;font:inherit}button:hover{background:#37516c}.gold{background:#b18c3d;color:#101621;border-color:#d5b566;font-weight:800}.danger{background:#542a35}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.small{font-size:12px;color:#91a2b8}.timer{font-size:clamp(70px,10vw,160px);font-weight:900;letter-spacing:-5px;line-height:1.15;text-align:center;font-variant-numeric:tabular-nums}.center{text-align:center}.big{font-size:clamp(26px,4vw,56px);font-weight:850}.goldtext{color:#e4c16b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1522;border-radius:9px;padding:12px;text-align:center}.stat strong{display:block;font-size:26px}.levels{max-height:230px;overflow:auto}.levelrow{display:grid;grid-template-columns:45px 1fr 1fr 1fr 75px 38px;gap:5px;margin:6px 0;align-items:center}.levelrow input{padding:7px;min-width:0}.levelrow button{padding:8px 3px}.screen{min-height:560px;background:linear-gradient(135deg,#101d30,#080c14);border:1px solid #765f34;border-radius:16px;padding:22px}.notice{padding:18px;background:#172437;border-radius:9px;font-size:23px;min-height:95px;overflow-wrap:anywhere}.warn{color:#ffb6a3}body.projector main{max-width:none}body.projector .editor{display:none}body.projector .grid{display:block}body.projector header .hint{display:none}body.projector .screen{min-height:calc(100vh - 120px)}@media(max-width:850px){.grid{grid-template-columns:1fr}.timer{font-size:78px}.levelrow{grid-template-columns:30px repeat(3,1fr) 55px 30px}.levelrow input{font-size:12px}}
</style></head><body><header><h1>EPC · TOURNAMENT CLOCK <span class="small">獨立測試版 V0.1</span></h1><div class="hint small">僅本機測試資料｜尚未連接正式 EPC / Firebase / 顯示設備</div></header><main><div class="grid"><div class="editor">
<section class="card"><h2>賽事與計時器</h2><label>選擇測試賽事</label><select id="events"></select><div class="row"><button onclick="createEvent()">＋建立賽事與計時器</button><button class="danger" onclick="deleteEvent()">刪除賽事</button></div><label>賽事名稱</label><input id="eventName" placeholder="賽事名稱" onchange="renameEvent()"><label>選擇盲注範本</label><select id="templates"></select><div class="row"><button onclick="applyTemplate()">套用範本到本場</button><button onclick="saveTemplate()">儲存目前結構為新範本</button></div></section>
<section class="card"><h2>盲注結構</h2><div class="levels" id="levelRows"></div><div class="row"><button onclick="addLevel()">＋新增級別</button><button onclick="addBreak()">＋休息</button></div><p class="small">欄位依序：級別、SB、BB、Ante、分鐘、刪除。休息列的盲注欄位留空。</p></section>
<section class="card"><h2>後台即時控制</h2><div class="row"><button class="gold" onclick="toggleRun()" id="playBtn">▶ 開始</button><button onclick="shiftTime(-60)">－1 分鐘</button><button onclick="shiftTime(60)">＋1 分鐘</button></div><div class="row"><button onclick="changeLevel(-1)">上一級</button><button onclick="changeLevel(1)">下一級</button><button onclick="resetLevel()">重設本級時間</button></div><label>指定剩餘秒數</label><div class="row"><input type="number" id="setSeconds" min="0" value="1200"><button onclick="setRemaining()">設定</button></div></section>
<section class="card"><h2>參賽與公告（測試資料）</h2><div class="row"><div><label>參賽人數</label><input id="players" type="number" min="0" onchange="updateStats()"></div><div><label>重買人數</label><input id="rebuyPlayers" type="number" min="0" onchange="updateStats()"></div><div><label>總組數</label><input id="groups" type="number" min="0" onchange="updateStats()"></div></div><label>右側顯示模式</label><select id="mode" onchange="updateStats()"><option value="prize">獎池</option><option value="notice">場內公告</option></select><label>每組獎池金額（0 代表不自動計算）</label><input id="unit" type="number" min="0" onchange="updateStats()"><label>公告文字</label><textarea id="announcement" rows="3" oninput="updateStats()"></textarea><p class="small">正式整合時這些統計將從 EPC 賽事讀取；此頁先用測試值模擬。</p></section>
</div><div><section class="screen"><div class="row"><strong class="goldtext">EPC POKER TOURNAMENT</strong><button style="flex:0 0 auto" onclick="toggleProjector()">投影全螢幕切換</button></div><p class="center goldtext" id="screenEvent"></p><p class="center goldtext" id="levelTitle">LEVEL 1</p><div class="timer" id="clock">20:00</div><p class="center small" id="status">待開始</p><div class="center goldtext">目前盲注</div><div class="center big" id="currentBlind">100 / 200</div><div class="center small" id="currentAnte">ANTE 200</div><hr style="border-color:#28364a;margin:26px 0"><div class="center">下一級：<span class="goldtext" id="nextBlind">200 / 400</span></div><div class="stats" style="margin-top:25px"><div class="stat">參賽人數<strong id="sPlayers">0</strong></div><div class="stat">重買人數<strong id="sRebuys">0</strong></div><div class="stat">總組數<strong id="sGroups">0</strong></div></div><h3 id="extraTitle">總獎池</h3><div class="notice center" id="extraContent">$0</div></section></div></div></main><script>
const KEY='epc-timer-prototype-v1';const base=[{sb:100,bb:200,ante:200,min:20},{sb:200,bb:400,ante:400,min:20},{sb:300,bb:600,ante:600,min:20},{sb:500,bb:1000,ante:1000,min:20},{break:true,min:5},{sb:1000,bb:1500,ante:1500,min:20},{sb:1000,bb:2000,ante:2000,min:20}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.events))state={templates:[{id:'standard',name:'20分鐘標準賽',levels:base}],events:[],selected:null};let tick=Date.now();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const current=()=>state.events.find(e=>e.id===state.selected);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function newEvent(name){return{id:'E'+Date.now()+Math.random().toString(36).slice(2,5),name,levels:structuredClone(base),index:0,remaining:1200,running:false,players:0,rebuyPlayers:0,groups:0,unit:0,mode:'notice',announcement:'歡迎參加 EPC 限時錦標賽'}}
function createEvent(){const name=prompt('測試賽事名稱','EPC 測試賽事');if(!name)return;const e=newEvent(name);const t=state.templates.find(x=>x.id===$('templates').value);if(t)e.levels=structuredClone(t.levels);e.remaining=e.levels[0].min*60;state.events.push(e);state.selected=e.id;save();render()}
function deleteEvent(){const e=current();if(!e||!confirm('刪除「'+e.name+'」與其測試計時器？範本會保留。'))return;state.events=state.events.filter(x=>x.id!==e.id);state.selected=state.events[0]?.id||null;save();render()}
function renameEvent(){const e=current();if(e){e.name=$('eventName').value;save();render()}}
function saveTemplate(){const e=current();if(!e)return;const name=prompt('新範本名稱','我的盲注結構');if(!name)return;state.templates.push({id:'T'+Date.now(),name,levels:structuredClone(e.levels)});save();render()}
function applyTemplate(){const e=current(),t=state.templates.find(x=>x.id===$('templates').value);if(!e||!t)return;if(!confirm('套用範本將重設此計時器的級別和剩餘時間，確定？'))return;e.levels=structuredClone(t.levels);e.index=0;e.remaining=e.levels[0].min*60;e.running=false;save();render()}
function render(){const e=current();$('events').innerHTML=state.events.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');$('events').value=state.selected||'';$('templates').innerHTML=state.templates.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join('');$('eventName').value=e?.name||'';for(const id of ['players','rebuyPlayers','groups','unit','announcement','mode'])$(id).value=e?.[id]??'';renderLevels();renderScreen()}
function renderLevels(){const e=current();$('levelRows').innerHTML=e?e.levels.map((l,i)=>'<div class="levelrow"><span>'+(l.break?'休':i+1)+'</span><input aria-label="SB" type="number" placeholder="SB" '+(l.break?'disabled':'')+' value="'+(l.sb??'')+'" onchange="editLevel('+i+',\'sb\',this.value)"><input aria-label="BB" type="number" placeholder="BB" '+(l.break?'disabled':'')+' value="'+(l.bb??'')+'" onchange="editLevel('+i+',\'bb\',this.value)"><input aria-label="Ante" type="number" placeholder="Ante" '+(l.break?'disabled':'')+' value="'+(l.ante??'')+'" onchange="editLevel('+i+',\'ante\',this.value)"><input aria-label="分鐘" type="number" min="1" value="'+l.min+'" onchange="editLevel('+i+',\'min\',this.value)"><button onclick="removeLevel('+i+')">×</button></div>').join(''):'請建立測試賽事'}
function editLevel(i,k,v){const e=current();if(!e)return;e.levels[i][k]=Math.max(k==='min'?1:0,Number(v)||0);save();renderScreen()}
function addLevel(){const e=current();if(!e)return;e.levels.push({sb:1000,bb:2000,ante:2000,min:20});save();renderLevels();renderScreen()}
function addBreak(){const e=current();if(!e)return;e.levels.push({break:true,min:5});save();renderLevels();renderScreen()}
function removeLevel(i){const e=current();if(!e||e.levels.length===1)return;e.levels.splice(i,1);e.index=Math.min(e.index,e.levels.length-1);e.remaining=e.levels[e.index].min*60;save();render()}
function toggleRun(){const e=current();if(!e)return;e.running=!e.running;tick=Date.now();save();renderScreen()}
function changeLevel(d){const e=current();if(!e)return;e.index=Math.max(0,Math.min(e.levels.length-1,e.index+d));e.remaining=e.levels[e.index].min*60;tick=Date.now();save();renderScreen()}
function resetLevel(){const e=current();if(!e)return;e.remaining=e.levels[e.index].min*60;save();renderScreen()}
function shiftTime(n){const e=current();if(!e)return;e.remaining=Math.max(0,e.remaining+n);save();renderScreen()}
function setRemaining(){const e=current();if(!e)return;e.remaining=Math.max(0,Math.floor(Number($('setSeconds').value)||0));save();renderScreen()}
function updateStats(){const e=current();if(!e)return;for(const id of ['players','rebuyPlayers','groups','unit'])e[id]=Math.max(0,Number($(id).value)||0);e.mode=$('mode').value;e.announcement=$('announcement').value;save();renderScreen()}
function renderScreen(){const e=current();if(!e){$('screenEvent').textContent='請先建立測試賽事';return}const l=e.levels[e.index],n=e.levels[e.index+1];$('screenEvent').textContent=e.name;$('levelTitle').textContent=l.break?'休息時間':'LEVEL '+(e.index+1);$('clock').textContent=String(Math.floor(e.remaining/60)).padStart(2,'0')+':'+String(e.remaining%60).padStart(2,'0');$('status').textContent=e.running?'計時中':'暫停 / 待開始';$('currentBlind').textContent=l.break?'BREAK':l.sb.toLocaleString()+' / '+l.bb.toLocaleString();$('currentAnte').textContent=l.break?'':('ANTE '+l.ante.toLocaleString());$('nextBlind').textContent=n?(n.break?'休息':n.sb.toLocaleString()+' / '+n.bb.toLocaleString()):'結束';$('sPlayers').textContent=e.players;$('sRebuys').textContent=e.rebuyPlayers;$('sGroups').textContent=e.groups;const prize=e.mode==='prize'&&e.unit>0;$('extraTitle').textContent=prize?'總獎池':'場內公告';$('extraContent').textContent=prize?'$'+(e.groups*e.unit).toLocaleString():(e.announcement||'暫無公告');$('playBtn').textContent=e.running?'Ⅱ 暫停':'▶ 開始'}
function toggleProjector(){document.body.classList.toggle('projector');if(document.body.classList.contains('projector'))document.documentElement.requestFullscreen?.().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{})}
$('events').addEventListener('change',ev=>{state.selected=ev.target.value;save();render()});
setInterval(()=>{const now=Date.now(),dt=Math.max(0,Math.floor((now-tick)/1000));tick=now;const e=current();if(e?.running&&dt){e.remaining=Math.max(0,e.remaining-dt);if(e.remaining===0){e.running=false;alert('本級時間結束，請手動切換下一級')}save();renderScreen()}},1000);
if(!state.events.length){const e=newEvent('EPC 計時器示範賽事');state.events.push(e);state.selected=e.id;save()}render();
</script></body></html>
