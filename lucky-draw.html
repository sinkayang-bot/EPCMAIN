<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 幸運加乘抽選</title><link rel="stylesheet" href="lucky-draw.css?v=20261115-draw3"><body><main class="draw-shell"><header class="draw-top"><h1>EPC 幸運加乘</h1><select id="prize" aria-label="現在抽選的獎項"></select><button id="draw" class="primary" disabled>開始抽獎</button><button id="settingsToggle" class="operator-only">獎項與機率設定</button><button id="resetDraw" class="operator-only" style="border-color:#a55;color:#ffb4a8">重置本期抽選</button><button id="rulesToggle">抽選規則</button></header><div class="draw-status" id="status">正在連線…</div><section id="settings" class="draw-settings" hidden></section><div class="draw-layout"><section><h2>參與名單</h2><div id="people" class="draw-people"></div></section><aside><h2>全部獎項與得獎者</h2><div id="prizes"></div></aside></div></main><dialog id="rulesDialog"><h2>抽選規則</h2><p>依設定權重隨機抽選，每人最多中 2 個獎。名單依積分排序，權重調整不影響積分。</p><form method="dialog"><button>關閉</button></form></dialog><script src="firebase-config.js"></script><script src="lucky-draw-core.js?v=20261115-draw3"></script><script type="module" src="lucky-draw-view.js?v=20261115-draw4"></script></body></html>
