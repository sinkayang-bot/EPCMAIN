<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 計時器後臺</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:16px system-ui,'Noto Sans TC',sans-serif}header{padding:14px 20px;border-bottom:1px solid #9d7b31;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0;color:#e9c568}h2{font-size:18px;color:#e9c568}main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;padding:16px}.card{background:#111;border:1px solid #514322;border-radius:12px;padding:16px;margin-bottom:14px}label{display:block;margin:12px 0 5px;font-size:14px}input,textarea,select,button{font:inherit;color:#fff;background:#090909;border:1px solid #65512d;border-radius:6px;padding:9px;width:100%}button{cursor:pointer;margin:5px 0;background:#242018}button:disabled{opacity:.4;cursor:default}button.primary{background:#d2ad50;color:#080808;font-weight:700}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.small{font-size:13px;color:#b7b7b7;line-height:1.6}#message{min-height:22px;color:#f0d186}#timeNow{font:700 46px Arial;color:#fff;margin:8px 0}.preview{position:sticky;top:12px;align-self:start}.preview iframe{border:0;width:100%;aspect-ratio:16/9;background:black}.preview a{color:#e9c568}#levels{max-height:300px;overflow:auto}.levelrow{display:grid;grid-template-columns:35px repeat(3,minmax(0,1fr)) 58px 30px;gap:3px;margin:5px 0;align-items:center}.levelrow input,.levelrow button{padding:6px 2px;font-size:13px}.toolbar{display:flex;gap:8px}.toolbar button{width:auto}#stats{line-height:1.9}#mode{margin-left:auto}.badge{color:#e9c568}details summary{cursor:pointer;color:#e9c568}a{color:#e9c568}@media(max-width:950px){main{grid-template-columns:1fr}.preview{position:static;grid-row:1}.controls{max-width:none}}[hidden]{display:none!important}
</style></head><body><header><h1 id="title">EPC 計時器</h1><span id="mode" class="small"></span></header><main><div class="controls">
<button id="reloadSettings" type="button">重新讀取最新設定</button><p id="message" role="status">正在讀取賽事與計時器…</p>
<section class="card"><h2>即時控制</h2><div id="timeNow">—</div><p class="small" id="currentLevel"></p><button id="create" class="primary" data-write>建立本場計時器</button><div class="row"><button id="toggle" class="primary" data-command data-write>開始</button><button id="reset" data-command data-write>重設本級</button></div><div class="row"><button id="previous" data-command data-write>上一級</button><button id="next" data-command data-write>下一級</button></div><div class="row"><button id="minus" data-command data-write>－1 分鐘</button><button id="plus" data-command data-write>＋1 分鐘</button></div><label for="remainingTime">剩餘時間（分：秒）</label><div class="row"><input id="remainingTime" placeholder="12:35" data-write><button id="setTime" data-command data-write>設定時間</button></div></section>
<section class="card"><h2>盲注範本與結構</h2><label for="templates">選擇範本</label><select id="templates" data-write><option value="default">20 分鐘標準賽</option></select><p class="small">級別／小盲／大盲／Ante／分鐘</p><div id="levels"></div><div class="row"><button id="addLevel" data-write>＋級別</button><button id="addBreak" data-write>＋休息</button></div><button id="applyStructure" data-write>套用結構並重設計時器</button><label for="templateName">範本名稱</label><input id="templateName" placeholder="例如：3400 限時賽" data-write><button id="saveTemplate" data-write>儲存為共用範本</button></section>
<section class="card"><h2>公告與獎池分佈</h2><label for="announcement">場內公告</label><textarea id="announcement" rows="5" data-write></textarea><label for="payoutInput">名次與獎勵（每行一筆）</label><textarea id="payoutInput" rows="5" placeholder="第一名 10,000&#10;依籌碼比例分配" data-write></textarea><button id="saveText" data-command data-write>儲存公告與獎勵</button></section>
<section class="card"><h2>賽事即時資訊</h2><div id="stats">正在讀取…</div><p class="small">直接讀取本場報名、重買、加購與起始籌碼；總獎池使用扣除 JP 後的可發獎金。</p></section>
</div><section class="preview"><iframe id="preview" title="本場計時器投影預覽"></iframe><p class="small">右側為投影畫面，左側控制不會出現在電視上。</p><a id="projector" target="_blank" rel="noopener">另開純投影畫面</a><p class="small">電視請在「顯示設備」選擇「賽事計時器」、指定本場，再按「套用到螢幕」。</p></section></main><script src="firebase-config.js"></script><script type="module" src="timer-control.js?v=20261021-integrate1"></script></body></html>
