<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="32x32" href="assets/epc-icon-32.png?v=20261024-brand46"><link rel="apple-touch-icon" sizes="180x180" href="assets/epc-icon-180.png?v=20261024-brand46"><meta name="apple-mobile-web-app-title" content="EPC"><link rel="stylesheet" href="brand.css?v=20261024-brand46"><title>EPC 計時器後臺</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:16px system-ui,'Noto Sans TC',sans-serif}header{padding:14px 20px;border-bottom:1px solid #9d7b31;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0;color:#e9c568}h2{font-size:18px;color:#e9c568}main{max-width:1400px;margin:auto;padding:16px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}.controls>.card{margin:0}.controls>#reloadSettings,.controls>#message{grid-column:1/-1}.controls>#message{margin:0}.controls>#reloadSettings{width:auto;justify-self:start}.card{background:#111;border:1px solid #514322;border-radius:12px;padding:16px;margin-bottom:14px}label{display:block;margin:12px 0 5px;font-size:14px}input,textarea,select,button{font:inherit;color:#fff;background:#090909;border:1px solid #65512d;border-radius:6px;padding:9px;width:100%}button{cursor:pointer;margin:5px 0;background:#242018}button:disabled{opacity:.4;cursor:default}button.primary{background:#d2ad50;color:#080808;font-weight:700}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.small{font-size:13px;color:#b7b7b7;line-height:1.6}#message{min-height:22px;color:#f0d186}#timeNow{font:700 46px Arial;color:#fff;margin:8px 0}.preview{position:sticky;top:12px;align-self:start}.preview iframe{border:0;width:100%;aspect-ratio:16/9;background:black}.preview a{color:#e9c568}#levels{max-height:300px;overflow:auto}.levelrow{display:grid;grid-template-columns:35px repeat(3,minmax(0,1fr)) 58px 30px;gap:3px;margin:5px 0;align-items:center}.levelrow input,.levelrow button{padding:6px 2px;font-size:13px}.toolbar{display:flex;gap:8px}.toolbar button{width:auto}#stats{line-height:1.9}#mode{margin-left:auto}.badge{color:#e9c568}details summary{cursor:pointer;color:#e9c568}a{color:#e9c568}@media(max-width:850px){.controls{grid-template-columns:1fr}}[hidden]{display:none!important}
</style><link rel="stylesheet" href="timer-appearance.css?v=20261023-tablet-rgb41"></head><body><header><img class="epc-brand-logo" src="assets/epc-brand.png?v=20261024-brand46" alt="EPC 原版 LOGO" width="128" height="58"><h1 id="title">EPC 計時器</h1><span class="small">投影預覽與電視設定請至「顯示設備」</span><span id="mode" class="small"></span></header><main><div class="controls">
<div class="row" style="grid-column:1/-1"><button id="reloadSettings" type="button">重新讀取最新設定</button><button id="previewTimer" type="button">預覽計時器</button></div><p id="message" role="status">正在讀取賽事與計時器…</p>
<section class="card"><h2>即時控制</h2><div id="timeNow">—</div><p style="color:#e9c568;font-size:18px">賽事剩餘時間（含休息）：<strong id="tournamentCountdown">—</strong></p><p class="small" id="currentLevel"></p><div class="row"><button id="toggle" class="primary" data-command data-write>開始</button><button id="reset" data-command data-write>重設本級</button></div><div class="row"><button id="previous" data-command data-write>上一級</button><button id="next" data-command data-write>下一級</button></div><div class="row"><button id="minus" data-command data-write>－1 分鐘</button><button id="plus" data-command data-write>＋1 分鐘</button></div><label for="remainingTime">剩餘時間（分：秒）</label><div class="row"><input id="remainingTime" placeholder="12:35" data-write><button id="setTime" data-command data-write>設定時間</button></div></section>
<section class="card"><h2>本場盲注結構</h2><p class="small">級別／小盲／大盲／Ante／分鐘</p><div id="levels"></div><div class="row"><button id="addLevel" data-write>＋級別</button><button id="addBreak" data-write>＋休息</button></div><button id="applyStructure" data-write>套用結構並重設計時器</button><p class="small">共用範本請到獨立「計時器 → 計時器範本」管理。</p></section>
<section class="card"><h2>背景、公告與獎池分佈</h2><label for="background">計時器背景</label><select id="background" data-write><option value="classic">原始深黑</option><option value="black-gold">經典黑金撲克</option><option value="light">黑金光影</option><option value="emerald">暗綠賭桌</option><option value="velvet">酒紅絲絨</option></select><button id="applyTemplateBackground" data-command data-write>套用範本背景</button><p class="small">讀取本場範本最新背景，不重設時間、盲注或公告。</p><div id="appearanceEditor"></div><label for="announcement">場內公告</label><textarea id="announcement" rows="5" data-write></textarea><label for="payoutInput">名次與獎勵（每行一筆）</label><textarea id="payoutInput" rows="5" placeholder="第一名 10,000&#10;依籌碼比例分配" data-write></textarea><button id="saveText" data-command data-write>儲存背景、公告與獎勵</button></section>
<section class="card"><h2>賽事即時資訊</h2><div id="stats">正在讀取…</div><p class="small">直接讀取本場報名、重買、加購與起始籌碼；總獎池使用扣除 JP 後的可發獎金。</p></section>
</div></main><dialog id="timerPreviewDialog" style="width:96vw;max-width:1920px;height:90vh;max-height:none;padding:0;background:#000;border:1px solid #b89340;border-radius:12px;color:white"><div class="row" style="height:48px;align-items:center;padding:6px 14px"><b>預覽計時器</b><button id="closePreview" type="button" style="width:auto;flex:0">關閉</button></div><iframe allow="autoplay" id="timerPreviewFrame" title="計時器預覽" style="width:100%;height:calc(100% - 90px);border:0"></iframe><p class="small" style="padding:0 14px;margin:5px 0">僅供預覽。正式投影請至「顯示設備」選擇設備並套用。</p></dialog><script src="firebase-config.js"></script><script type="module" src="timer-control.js?v=20261024-start-level3"></script></body></html>
