<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC｜活動公開看板</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#f5f2eb;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1080px;margin:auto;padding:32px 18px}.epc-logo{display:block;width:196px;height:104px;object-fit:contain;margin:0 auto 12px;padding:12px 16px;background:#fff;border:2px solid #d8b45f;border-radius:14px;box-shadow:0 5px 18px rgba(230,194,120,.18)}.brand{text-align:center;color:#e7c479;letter-spacing:3px;font-weight:800;font-size:13px}h1{text-align:center;margin:12px 0 4px}p.sub{text-align:center;color:#adb5c0}.panel{background:#171b22;border:1px solid #655536;border-radius:14px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.tile{background:#1a2029;border:1px solid #4a4c4b;border-radius:12px;padding:20px;text-align:left;color:#fff;cursor:pointer}.tile.active{border-color:#e6c278}.tile h3{margin:0 0 10px;color:#e6c278}.muted{color:#aeb5c0;font-size:13px;line-height:1.7}.gold{color:#e6c278}input{width:100%;background:#0b0f15;color:#fff;border:1px solid #626977;border-radius:8px;padding:13px;font-size:16px}button.action{background:#e6c278;color:#241b0c;border:0;border-radius:8px;padding:13px 20px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.search{display:flex;gap:10px;flex-wrap:wrap}.search input{flex:1;min-width:190px}.status{margin-top:14px;padding:12px;background:#252c38;border-radius:8px;color:#e6d3aa}.hidden{display:none}.entry{padding:12px 0;border-bottom:1px solid #333b47}.entry:last-child{border-bottom:0}.entry strong{color:#e6c278}.footer{text-align:center;color:#aeb5c0;font-size:12px;margin:35px 0}pre{white-space:pre-wrap;font-family:inherit;line-height:1.8}.tag{font-size:12px;color:#e6c278}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid #343b46}th{color:#e6c278}#detail h2{margin-top:0}</style></head><body><main><img class="epc-logo" src="../assets/epc-brand.png?v=20261024-brand46" alt="EPC Eight Poker Club LOGO" width="196" height="104"><div class="brand">EIGHT POKER CLUB</div><h1>EPC 活動公開看板</h1><p class="sub">查看活動規則、排行榜與個人進度｜公開唯讀</p><section class="panel" id="lookupPanel"><h2>會員活動查詢</h2><div class="search"><input id="query" placeholder="輸入會員編號或姓名" autocomplete="off"><button id="go" class="action">查詢</button></div><div id="result" class="status hidden" role="status"></div><p class="muted">先選擇活動，再輸入會員編號或公開顯示名稱查詢該活動進度。</p></section><section class="panel"><h2>目前活動</h2><div id="catalogStatus" class="muted">讀取活動列表中…</div><div id="cards" class="grid"></div></section><section id="detail" class="panel hidden"><h2 id="activityName"></h2><div id="activityInfo"></div><h3>目前排行榜</h3><div id="ranking" class="muted"></div><p class="muted">僅顯示經管理員發布的活動資訊。姓名查詢僅限已公開的排行榜資料；不顯示會員帳務或其他個資。</p></section><p class="footer">EPC · 公開活動資訊</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getFirestore,doc,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import '../firebase-config.js';
const db=getFirestore(initializeApp(window.EPC_FIREBASE_CONFIG,'epc-public-board'));
const el=id=>document.getElementById(id);
let activities=[],selected=null,catalogReceived=false;
let activeQuery='',stopMember=null,memberData=null,memberReady=false,memberError='';
function stopLookup(){if(stopMember)stopMember();stopMember=null;memberData=null;memberReady=false;memberError='';}
function renderLookup(){
 if(!activeQuery||!selected)return;
 const ranks=Array.isArray(selected.leaderboard)?selected.leaderboard:[];
 const found=ranks.find(r=>[r.memberId,r.name,r.displayName].some(v=>v&&safe(v).toLowerCase()===activeQuery.toLowerCase()));
 const a=memberReady?memberData?.activities?.[selected.id]:null;
 if(a)return status(selected.id==='weekly'?weeklyResult(a):['名次：'+safe(a.rank??'未公布'),'點數：'+safe(a.points??'未公布'),'次數：'+safe(a.count??'未公布'),'進度：'+safe(a.progress??a.status??'未公布')].join('｜'));
 if(found)return status(selected.id==='weekly'?weeklyResult(found):'目前名次：'+safe(found.rank??ranks.indexOf(found)+1)+'｜點數／進度：'+safe(found.points??found.progress??'尚未公布'));
 if(memberError)return status('即時查詢失敗：'+memberError);
 if(stopMember&&!memberReady)return status('正在查詢…');
 status('此會員目前沒有此活動已發布的進度');
}
const safe=v=>String(v??'');
const put=(parent,tag,value,cls)=>{const n=document.createElement(tag);n.textContent=safe(value);if(cls)n.className=cls;parent.append(n);return n};
const status=msg=>{el('result').classList.remove('hidden');el('result').textContent=msg};
function weeklyReward(r){
 const days=Number(r.days??0),games=Number(r.games??0);
 const dayLevel=days>=7?3:days>=5?2:days>=3?1:0;
 const gameLevel=games>=15?3:games>=10?2:games>=5?1:0;
 const couponFor=l=>l===1?200:l===2?400:0;
 const cashFor=l=>l===3?1000:0;
 return {days,games,dayLevel,gameLevel,dayCoupon:couponFor(dayLevel),gameCoupon:couponFor(gameLevel),
  coupon:r.coupon==null?couponFor(dayLevel)+couponFor(gameLevel):Number(r.coupon),
  cash:r.cash==null?cashFor(dayLevel)+cashFor(gameLevel):Number(r.cash)};
}
function weeklyResult(r){
 const w=weeklyReward(r);
 return '簽到：'+w.days+' 天（第 '+w.dayLevel+' 階，折價卡 $'+w.dayCoupon+'）｜場次：'+w.games+' 場（第 '+w.gameLevel+' 階，折價卡 $'+w.gameCoupon+'）｜合計折價卡：$'+w.coupon+'｜合計獎金：$'+w.cash+'｜'+(w.dayLevel||w.gameLevel?(r.claimed?'已領取':'未領取'):'未達標');
}
function drawActivity(a){
 selected=a;el('detail').classList.remove('hidden');
 el('activityName').textContent=a.title||a.name||a.id;
 const info=el('activityInfo');info.replaceChildren();
 for(const [label,key] of [['活動期間','period'],['活動獎勵','rewards'],['活動規則','rules']]){
  if(a[key]){put(info,'h4',label,'gold');put(info,'pre',typeof a[key]==='string'?a[key]:JSON.stringify(a[key]))}
 }
 const ranks=Array.isArray(a.leaderboard)?a.leaderboard:[];
 const area=el('ranking');area.replaceChildren();
 if(!ranks.length)put(area,'p','目前沒有已發布的排行榜資料');
 else{
  const table=put(area,'table','');const head=put(table,'tr','');
  const columns=a.id==='weekly'?['公開顯示名稱','簽到進度','場次進度','折價卡','獎金','領取狀態']:['名次','公開顯示名稱','點數／進度'];
  columns.forEach(t=>put(head,'th',t));
  ranks.forEach((r,i)=>{
   const row=put(table,'tr','');
   if(a.id==='weekly'){
    const w=weeklyReward(r);
    put(row,'td',r.displayName||r.name||r.memberId||'匿名');
    put(row,'td',w.days+' 天／第 '+w.dayLevel+' 階');
    put(row,'td',w.games+' 場／第 '+w.gameLevel+' 階');
    put(row,'td','$'+w.coupon);put(row,'td','$'+w.cash);
    put(row,'td',w.dayLevel||w.gameLevel?(r.claimed?'已領取':'未領取'):'未達標');
   }else{
    put(row,'td',r.rank??i+1);
    put(row,'td',r.displayName||r.name||r.memberId||'匿名');
    put(row,'td',r.points??r.progress??'—');
   }
  });
 }
 if(activeQuery)renderLookup();else el('result').classList.add('hidden');
 document.querySelectorAll('.tile').forEach(b=>b.classList.toggle('active',b.dataset.id===a.id));
}
function paint(){
 el('cards').replaceChildren();
 el('catalogStatus').textContent=activities.length?'選擇活動查看詳細資訊：':'目前尚未發布活動列表';
 for(const a of activities){
  const b=put(el('cards'),'button','','tile');b.type='button';b.dataset.id=a.id;
  put(b,'h3',a.title||a.name||a.id);put(b,'div',a.period||'活動期間未公告','muted');
  b.onclick=()=>drawActivity(a);
 }
 if(activities.length)drawActivity(activities.find(a=>a.id===selected?.id)||activities[0]);
 else {selected=null;el('detail').classList.add('hidden');if(activeQuery)status('目前沒有已發布的活動');}
}
onSnapshot(doc(db,'epc_public_activity_catalog','current'),snap=>{
 catalogReceived=true;
 activities=snap.exists()&&Array.isArray(snap.data().activities)?snap.data().activities.filter(a=>a&&a.id&&a.active!==false):[];paint();
},err=>{console.warn('Public catalog realtime unavailable',err);el('catalogStatus').textContent='公開活動資料讀取失敗，請確認 Firebase 權限。'});
async function load(){
 try{
  const response=await fetch('./activity-ranking.json?t='+Date.now(),{cache:'no-store'});
  if(response.ok){const published=await response.json();if(!catalogReceived&&Array.isArray(published.activities))activities=published.activities.filter(a=>a&&a.id&&a.active!==false)}
  paint();
 }catch(e){el('catalogStatus').textContent='活動列表讀取失敗：'+safe(e.message)}
}
el('go').onclick=()=>{
 stopLookup();activeQuery=el('query').value.trim();
 if(!activeQuery)return status('請輸入會員編號或姓名');
 if(!selected)return status('請先選擇活動');
 const ranks=Array.isArray(selected.leaderboard)?selected.leaderboard:[];
 const found=ranks.find(r=>[r.memberId,r.name,r.displayName].some(v=>v&&safe(v).toLowerCase()===activeQuery.toLowerCase()));
 const memberId=found?.memberId||(/^[A-Za-z0-9_-]{3,32}$/.test(activeQuery)?activeQuery.toUpperCase():null);
 if(memberId){
  const lookupKey=activeQuery;
  stopMember=onSnapshot(doc(db,'epc_public_activity',String(memberId)),snap=>{
   if(activeQuery!==lookupKey)return;
   memberReady=true;memberData=snap.exists()?snap.data():null;memberError='';renderLookup();
  },err=>{if(activeQuery!==lookupKey)return;memberError=safe(err.message);renderLookup()});
 }
 renderLookup();
};
window.addEventListener('pagehide',stopLookup);
el('query').addEventListener('keydown',e=>{if(e.key==='Enter')el('go').click()});
load();
</script></body></html>
