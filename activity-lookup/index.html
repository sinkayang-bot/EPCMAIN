<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC｜活動參與查詢</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#f5f2eb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:38px 18px}.brand{text-align:center;color:#e7c479;letter-spacing:3px;font-weight:800;font-size:13px}h1{text-align:center;font-size:29px;margin:20px 0 6px}p{text-align:center;color:#aeb4bd}.panel{margin-top:30px;background:#171b22;border:1px solid #655536;border-radius:16px;padding:22px}label{display:block;margin-bottom:12px;font-weight:700}input{width:100%;padding:15px;font-size:18px;border-radius:9px;border:1px solid #626977;background:#0b0f15;color:#fff}button{margin-top:14px;width:100%;border:0;border-radius:9px;background:#e6c278;padding:15px;font-weight:800;font-size:18px;color:#20190c}.hint{font-size:13px;color:#b9bec6;line-height:1.7;text-align:left}.status{margin-top:15px;padding:13px;background:#252c38;border-radius:9px;color:#e6d3aa;line-height:1.6}.hidden{display:none}.footer{font-size:12px;margin-top:32px}</style></head><body><main><div class="brand">EIGHT POKER CLUB</div><h1>會員活動參與查詢</h1><p>查詢自己目前的活動進度</p><div class="panel"><label for="member">會員姓名或會員編號</label><input id="member" placeholder="請輸入姓名或會員編號" autocomplete="off"><button id="go">查詢活動</button><div id="status" class="status hidden" role="status"></div><div class="hint"><p class="hint">目前為同瀏覽器本機測試模式，只讀取 EPCMAIN 已儲存在此瀏覽器的資料，不會向雲端讀取或修改資料。</p></div></div><p class="footer">EPC · 活動參與查詢</p></main><script>
const input=document.getElementById('member'),status=document.getElementById('status');
function show(message){status.classList.remove('hidden');status.textContent=message}
function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('go').addEventListener('click',()=>{
 const q=input.value.trim();if(!q)return show('請先輸入會員姓名或編號。');
 let db;try{db=JSON.parse(localStorage.getItem('epcV1')||'null')}catch(e){}
 if(!db||!Array.isArray(db.members)||!db.members.length)return show('目前此瀏覽器沒有 EPCMAIN 管理端的本機資料。請先在同一台裝置與同一瀏覽器開啟 EPCMAIN，確認會員資料載入後再測試。此模式不會讀取雲端或上傳資料。');
 const matches=db.members.filter(m=>String(m.id??'').trim()===q||String(m.name??'').trim()===q);
 if(matches.length!==1)return show(matches.length?'有多位同名會員，請改用會員編號查詢。':'找不到符合的會員，請確認編號或姓名。');
 const m=matches[0],events=(db.events||[]).filter(e=>(e.players||[]).some(p=>[p.memberId,p.memberID,p.id,p.memberNo].some(v=>String(v??'')===String(m.id))||((e.players||[]).some(p=>String(p.name??'')===String(m.name)&&!p.memberId&&!p.memberID))));
 const activityKeys=Object.keys(db).filter(k=>/activity|hunter|umbrella|mission|ranking|leader|point|task|protect|bonus/i.test(k));
 status.innerHTML='<b>'+safe(m.name||'會員')+'（'+safe(m.id)+'）</b><div style="margin-top:10px">本機可辨識參賽場次：'+events.length+' 場</div><div style="margin-top:8px">'+events.slice(-12).reverse().map(e=>'<div style="padding:8px 0;border-top:1px solid #4b5260">'+safe(e.name||e.title||e.level||'賽事')+'　'+safe(e.date||'')+'</div>').join('')+'</div><div style="margin-top:10px;font-size:12px">活動積分資料結構待核對（偵測到 '+activityKeys.length+' 個相關欄位）。此頁為同瀏覽器本機測試，不是公開會員查詢服務。</div>';
});
</script></body></html>
