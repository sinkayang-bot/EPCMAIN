<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC｜活動參與查詢</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#f5f2eb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:38px 18px}.brand{text-align:center;color:#e7c479;letter-spacing:3px;font-weight:800;font-size:13px}h1{text-align:center;font-size:29px;margin:20px 0 6px}p{text-align:center;color:#aeb4bd}.panel{margin-top:30px;background:#171b22;border:1px solid #655536;border-radius:16px;padding:22px}label{display:block;margin-bottom:12px;font-weight:700}input{width:100%;padding:15px;font-size:18px;border-radius:9px;border:1px solid #626977;background:#0b0f15;color:#fff}button{margin-top:14px;width:100%;border:0;border-radius:9px;background:#e6c278;padding:15px;font-weight:800;font-size:18px;color:#20190c}.hint{font-size:13px;color:#b9bec6;line-height:1.7;text-align:left}.status{margin-top:15px;padding:13px;background:#252c38;border-radius:9px;color:#e6d3aa;line-height:1.6}.hidden{display:none}.footer{font-size:12px;margin-top:32px}</style></head><body><main><div class="brand">EIGHT POKER CLUB</div><h1>會員活動參與查詢</h1><p>查詢自己目前的活動進度</p><div class="panel"><label for="member">會員編號</label><input id="member" placeholder="請輸入會員編號" autocomplete="off"><button id="go" type="button">查詢活動</button><div id="status" class="status hidden" role="status"></div><div class="hint"><p class="hint">僅顯示已發布的活動紀錄，不包含會員個人資料或帳務。</p></div></div><p class="footer">EPC · 活動參與查詢</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import '../firebase-config.js';
const app=initializeApp(window.EPC_FIREBASE_CONFIG,'epc-public-lookup');
const db=getFirestore(app),input=document.getElementById('member'),status=document.getElementById('status'),button=document.getElementById('go');
function show(message){status.classList.remove('hidden');status.textContent=message}
function render(data,id){status.replaceChildren();status.classList.remove('hidden');const heading=document.createElement('b');heading.textContent='會員編號：'+id;status.append(heading);for(const [name,value] of Object.entries(data.activities||{})){const row=document.createElement('div');row.style.padding='12px 0';row.style.borderTop='1px solid #454d59';row.textContent=name+'：'+String(value);status.append(row)}if(!Object.keys(data.activities||{}).length)show('目前沒有已發布的活動紀錄。')}
button.onclick=async()=>{const id=input.value.trim().toUpperCase();if(!/^[A-Z0-9_-]{3,32}$/.test(id))return show('請輸入正確會員編號');button.disabled=true;show('正在讀取公開活動資料…');try{const snap=await getDoc(doc(db,'epc_public_activity',id));if(!snap.exists())return show('尚無此會員的公開活動資料。');render(snap.data(),id)}catch(e){show(e.code==='permission-denied'?'公開查詢權限尚未設定，請管理員設定 Firebase 規則。':'讀取失敗：'+String(e.message||e))}finally{button.disabled=false}};
</script></body></html>
