<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC｜活動參與查詢</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#f5f2eb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:38px 18px}.brand{text-align:center;color:#e7c479;letter-spacing:3px;font-weight:800;font-size:13px}h1{text-align:center;font-size:29px;margin:20px 0 6px}p{text-align:center;color:#aeb4bd}.panel{margin-top:30px;background:#171b22;border:1px solid #655536;border-radius:16px;padding:22px}label{display:block;margin-bottom:12px;font-weight:700}input{width:100%;padding:15px;font-size:18px;border-radius:9px;border:1px solid #626977;background:#0b0f15;color:#fff}button{margin-top:14px;width:100%;border:0;border-radius:9px;background:#e6c278;padding:15px;font-weight:800;font-size:18px;color:#20190c}.hint{font-size:13px;color:#b9bec6;line-height:1.7;text-align:left}.status{margin-top:15px;padding:13px;background:#252c38;border-radius:9px;color:#e6d3aa;line-height:1.6}.hidden{display:none}.footer{font-size:12px;margin-top:32px}</style></head><body><main><div class="brand">EIGHT POKER CLUB</div><h1>會員活動參與查詢</h1><p>查詢自己目前的活動進度</p><div class="panel"><label for="member">會員編號</label><input id="member" placeholder="請輸入會員編號" autocomplete="off"><button id="go" type="button">查詢活動</button><div id="status" class="status hidden" role="status"></div><div class="hint"><p class="hint">直接讀取 EPCMAIN 雲端賽事紀錄。目前測試參賽場數與參賽日期，活動積分尚未接入。</p></div></div><p class="footer">EPC · 活動參與查詢</p></main><script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import '../firebase-config.js';
const cfg=window.EPC_FIREBASE_CONFIG;
const app=getApps().find(a=>a.name==='epc-activity-public')||initializeApp(cfg,'epc-activity-public');
const db=getFirestore(app);
const input=document.getElementById('member'),status=document.getElementById('status'),button=document.getElementById('go');
function show(s){status.classList.remove('hidden');status.textContent=s}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
button.onclick=async()=>{
 const id=input.value.trim().toUpperCase();if(!/^[A-Z0-9_-]{3,32}$/.test(id))return show('請輸入正確會員編號。');
 button.disabled=true;show('正在讀取 EPCMAIN 即時賽事資料…');
 try{
  const snap=await getDocs(collection(db,'epc_events'));
  let games=0,days=new Set(),last='';
  for(const d of snap.docs){
   const e=d.data();if(e.status==='deleted')continue;
   const players=Array.isArray(e.players)?e.players:Object.values(e.players||{});
   if(!players.some(p=>String(p?.memberId||'').trim().toUpperCase()===id))continue;
   games++;
   const date=String(e.businessDate||e.date||'').slice(0,10);if(date)days.add(date);
   if(date>last)last=date;
  }
  if(!games)return show('查無此會員的雲端賽事紀錄。可能尚未同步，或該會員未曾參賽。');
  status.innerHTML='<b>會員編號：'+safe(id)+'</b><div style="margin-top:12px">已記錄參賽場數：'+games+'<div>參賽日期數：'+days.size+'</div><div>最近參賽日期：'+safe(last||'未記錄')+'</div></div><p style="font-size:12px;margin-top:14px">以上直接讀取 EPCMAIN Firebase 賽事紀錄。活動點數、抽獎券及任務進度尚未接入，不會以賽事場數冒充活動分數。</p>';
 }catch(e){show('Firebase 讀取失敗：'+(e?.code==='permission-denied'?'目前資料庫未開放此查詢權限。':String(e?.message||e)));}
 finally{button.disabled=false}
};
</script></body></html>
