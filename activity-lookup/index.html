<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC｜活動參與查詢</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:#f5f2eb;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:38px 18px}.brand{text-align:center;color:#e7c479;letter-spacing:3px;font-weight:800;font-size:13px}h1{text-align:center;font-size:29px;margin:20px 0 6px}p{text-align:center;color:#aeb4bd}.panel{margin-top:30px;background:#171b22;border:1px solid #655536;border-radius:16px;padding:22px}label{display:block;margin-bottom:12px;font-weight:700}input{width:100%;padding:15px;font-size:18px;border-radius:9px;border:1px solid #626977;background:#0b0f15;color:#fff}button{margin-top:14px;width:100%;border:0;border-radius:9px;background:#e6c278;padding:15px;font-weight:800;font-size:18px;color:#20190c}.hint{font-size:13px;color:#b9bec6;line-height:1.7;text-align:left}.status{margin-top:15px;padding:13px;background:#252c38;border-radius:9px;color:#e6d3aa;line-height:1.6}.hidden{display:none}.footer{font-size:12px;margin-top:32px}</style></head><body><main><div class="brand">EIGHT POKER CLUB</div><h1>會員活動參與查詢</h1><p>查詢自己目前的活動進度</p><div class="panel"><label for="member">會員姓名或會員編號</label><input id="member" placeholder="請輸入姓名或會員編號" autocomplete="off"><button id="go">查詢活動</button><div id="status" class="status hidden" role="status"></div><div class="hint"><p class="hint">目前為查詢頁面測試版，尚未啟用 EPCMAIN 即時資料查詢。為避免公開會員資料，正式查詢將加入必要的身分確認。</p></div></div><p class="footer">EPC · 活動參與查詢</p></main><script>document.getElementById('go').addEventListener('click',()=>{const x=document.getElementById('member').value.trim(),s=document.getElementById('status');s.classList.remove('hidden');s.textContent=x?'查詢功能尚未連接 EPCMAIN，現在不會顯示或儲存任何會員資料。':'請先輸入會員姓名或編號。';});</script></body></html>
