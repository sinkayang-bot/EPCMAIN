</style></head><body><main><div class="brand"><img src="assets/epc-brand.png?v=46" alt="EPC LOGO"><div><div class="eyebrow">TOURNAMENT SOUND LAB</div>比賽提示音試聽</div></div><h1>4 種用途，各 10 款聲音</h1><p>開始 2 秒・10／5 秒提示共用 1 秒・換級別 2 秒・結束 2 秒。<br>這批為可直接套入計時器的合成音；選好編號後再套用。</p><div class="controls"><button id="stop" type="button">■ 停止播放</button><label>音量 <input id="volume" type="range" min="0" max="100" step="5" value="90" aria-label="試聽音量"><output id="volumeValue">90%</output></label><span class="note">一次只播放一款，切換會停止上一款。</span></div><nav aria-label="聲音分類"><a href="#start">A 開始</a><a href="#count">B 10 秒／5 秒</a><a href="#level">C 換級別</a><a href="#finish">D 結束</a></nav><div id="groups"></div></main><footer><div class="footer-inner"><div id="selection" class="selection"></div><div id="status" role="status" aria-live="polite">點「試聽」開始，不會修改現場計時器。</div><div class="footer-actions"><button id="copy" type="button">複製選擇</button><span class="note">回覆例：開始 A2、倒數 B1、換級 C3、結束 D3</span></div></div></footer><script type="module" src="timer-sound-audition.js?v=1"></script></body></html>
