<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 免費版同步</title><link rel="stylesheet" href="../player/style.css?v=5"><header class="top"><img src="../assets/epc-brand.png?v=46" alt="EPC"><div><strong>FREE PUBLISHER</strong><span>賽況、活動與個人紀錄同步</span></div></header><main><h1>免費版同步頁</h1><p class="notice" id="status" role="status">請先設定獨立免費專案，並以管理員 Google 帳號登入。</p><a href="setup.html">免費試行設定</a><button id="login" class="full-button">管理員 Google 登入</button><button id="source" class="full-button secondary" disabled>載入現場來源（檢視模式）</button><section id="activityChoices" class="card" hidden><h2>要同步到玩家端的活動</h2><label class="consent"><input id="enable-rank" type="checkbox">週排行榜</label><p id="range-rank" class="small"></p><label class="consent"><input id="enable-hunter" type="checkbox">獵人排行榜</label><p id="range-hunter" class="small"></p><label class="consent"><input id="enable-umbrella" type="checkbox">保護傘</label><p id="range-umbrella" class="small"></p><label class="consent"><input id="enable-extremeTen" type="checkbox">極限 10 秒</label><p id="range-extremeTen" class="small"></p><p class="small">日期與成績沿用原後台。未設定日期的活動，請先到原後台「活動管理」設定。</p></section><button id="publish" class="full-button" disabled>同步勾選活動與賽事</button><p class="small">此頁發布公開賽況與匿名活動排行，並將已綁定會員的參賽紀錄同步到各自帳號。個人紀錄不會放進公開資料，也不會改動原 EPC 賽事或帳務。開始同步後每分鐘更新；需保持此頁與現場來源開啟。</p><details><summary>查看來源畫面</summary><iframe id="frame" title="現場 EPC 檢視來源" style="width:100%;height:500px;border:1px solid #444"></iframe></details></main><script src="../firebase-config.js"></script><script type="module" src="publisher.js?v=8"></script></html>
