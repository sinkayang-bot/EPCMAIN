<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 玩家記帳｜獨立測試</title><style>:root{color-scheme:dark}body{margin:0;background:#0c1420;color:#f0f4fa;font-family:system-ui,"Noto Sans TC",sans-serif}main{max-width:1150px;margin:auto;padding:22px}h1{margin-bottom:4px}.note{color:#b9c8d9}.warn{padding:13px;border:1px solid #b99147;background:#312719;border-radius:10px;margin:16px 0}.card{background:#182639;border:1px solid #34475d;border-radius:14px;padding:17px;margin:12px 0}input,select,button,textarea{font:inherit;border-radius:8px;padding:10px;border:1px solid #596b83;background:#0e1a2a;color:#f5f7fb;box-sizing:border-box}button{cursor:pointer;background:#314b68}button.primary{background:#b8924b;color:#101820;font-weight:800}button.danger{background:#6d3039}label{display:grid;gap:6px;font-size:14px}form,.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}form label{flex:1;min-width:160px}textarea{width:100%;min-height:60px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:#101e2f;border-radius:10px;padding:15px}.stat b{font-size:25px;display:block;margin-top:7px}.pos{color:#82d8ad}.neg{color:#f5a2a2}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #37495e;white-space:nowrap}.scroll{overflow:auto}.small{font-size:12px;color:#b9c8d9}#message{min-height:20px}</style></head><body><main><h1>EPC 玩家記帳 <span class="small">獨立測試版 V0.1</span></h1><div class="warn"><b>測試模式｜未連接 EPC MAIN 或 Firebase</b><div class="small">此頁只在目前瀏覽器保存測試資料。請勿輸入真實收付款作為正式帳務依據；目前不會修改會員、賽事、JP、分帳或 EPC 帳務。</div></div><div class="card"><h2>選擇玩家</h2><div class="row"><label>搜尋姓名／會員編號<input id="search" placeholder="輸入關鍵字"></label><label>玩家<select id="player"></select></label><button id="addPlayer">＋ 新增測試玩家</button><button id="removeDemo" class="danger">清空所有測試資料</button></div><p class="small">測試玩家須手動建立；正式版將改為唯讀查詢 EPC 會員資料。</p></div><div class="card"><h2 id="heading">帳戶總覽</h2><div class="row"><label>帳戶類型<select id="type"><option value="credit">沒寄錢（往來帳）</option><option value="deposit">有寄錢（寄存帳）</option></select></label></div><div class="stats" id="stats"></div><p class="small">應付與獎勵分開計算；未領獎金不會自動視為已領現金。賽事輸贏＝賽事獎金－賽事應付，JP 額外列示。</p></div><div class="card"><h2>新增測試流水</h2><form id="entry"><label>日期時間<input id="date" type="datetime-local" required></label><label>交易類型<select id="kind"><option value="due">賽事應付</option><option value="prize">賽事獎金（未領）</option><option value="jp">JP 獎勵（未領）</option><option value="payment">玩家實際付款</option><option value="payout">玩家領取獎金／JP</option><option value="offset">未領獎金抵扣應付</option><option value="depositIn">現金寄存入櫃台</option><option value="depositOut">寄存款提領</option><option value="awardToDeposit">未領獎勵轉寄存</option><option value="depositToDue">寄存款抵扣應付</option></select></label><label>金額（正數）<input id="amount" type="number" min="1" step="1" required></label><label>賽事識別／來源<input id="source" placeholder="如：10/11 第1場"></label><label>備註<input id="memo" placeholder="操作說明"></label><button class="primary" type="submit">確認新增測試流水</button></form><p id="message" class="small"></p></div><div class="card"><h2>玩家流水明細</h2><div class="scroll"><table><thead><tr><th>日期</th><th>類型</th><th>金額</th><th>來源</th><th>備註</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>(()=>{'use strict';const KEY='epc-player-ledger-prototype-v1';const $=id=>document.getElementById(id);const kinds={due:'賽事應付',prize:'賽事獎金（未領）',jp:'JP 獎勵（未領）',payment:'實際付款',payout:'獎勵領取',offset:'獎勵抵扣應付',depositIn:'現金寄存',depositOut:'寄存提領',awardToDeposit:'獎勵轉寄存',depositToDue:'寄存抵扣應付'};let db={players:[],entries:[]};try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.players)&&Array.isArray(v.entries))db=v}catch(e){}let selected='';const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Math.round(n).toLocaleString('zh-TW');const current=()=>db.players.find(p=>p.id===selected);function balances(id){const b={due:0,award:0,deposit:0,net:0,jp:0,paid:0,payout:0};db.entries.filter(x=>x.playerId===id).forEach(x=>{const n=x.amount;switch(x.kind){case'due':b.due+=n;b.net-=n;break;case'prize':b.award+=n;b.net+=n;break;case'jp':b.award+=n;b.jp+=n;break;case'payment':b.due-=n;b.paid+=n;break;case'payout':b.award-=n;b.payout+=n;break;case'offset':b.award-=n;b.due-=n;break;case'depositIn':b.deposit+=n;break;case'depositOut':b.deposit-=n;break;case'awardToDeposit':b.award-=n;b.deposit+=n;break;case'depositToDue':b.deposit-=n;b.due-=n;break}});return b}function render(){const q=$('search').value.trim().toLowerCase();const available=db.players.filter(p=>(p.name+' '+p.id).toLowerCase().includes(q));if(!available.some(p=>p.id===selected))selected=available[0]?.id||'';$('player').innerHTML=available.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'（'+esc(p.id)+'）</option>').join('');$('player').value=selected;const p=current();$('heading').textContent=p?'帳戶總覽｜'+p.name:'帳戶總覽｜尚無玩家';$('type').value=p?.type||'credit';$('type').disabled=!p;const b=balances(selected);const stats=[['尚未支付',b.due],['未領獎勵（含 JP）',b.award],['櫃台寄存',b.deposit],['賽事淨輸贏（不含 JP）',b.net],['額外 JP',b.jp],['已確認實付',b.paid],['已確認領取',b.payout]];$('stats').innerHTML=stats.map(([label,value])=>'<div class="stat"><span>'+label+'</span><b class="'+(value<0?'neg':value>0?'pos':'')+'">'+fmt(value)+'</b></div>').join('');$('rows').innerHTML=db.entries.filter(e=>e.playerId===selected).slice().reverse().map(e=>'<tr><td>'+esc(e.date)+'</td><td>'+esc(kinds[e.kind]||e.kind)+'</td><td>'+fmt(e.amount)+'</td><td>'+esc(e.source)+'</td><td>'+esc(e.memo)+'</td><td><button data-delete="'+esc(e.id)+'">刪除測試紀錄</button></td></tr>').join('')||'<tr><td colspan="6">尚無測試流水</td></tr>'}function dateNow(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}$('date').value=dateNow();$('search').oninput=render;$('player').onchange=e=>{selected=e.target.value;render()};$('addPlayer').onclick=()=>{const id=prompt('輸入測試會員編號');if(!id)return;const code=id.trim();if(!code)return;if(db.players.some(p=>p.id===code))return alert('會員編號已存在');const name=prompt('輸入測試玩家姓名');if(!name?.trim())return;db.players.push({id:code,name:name.trim(),type:'credit'});selected=code;$('search').value='';save();render()};$('type').onchange=e=>{const p=current();if(!p)return;p.type=e.target.value;save();render()};$('entry').onsubmit=e=>{e.preventDefault();if(!current())return alert('請先建立或選擇玩家');const kind=$('kind').value,amount=Number($('amount').value);if(!Number.isSafeInteger(amount)||amount<=0)return alert('請輸入正整數金額');const b=balances(selected);if((kind==='payout'||kind==='awardToDeposit')&&amount>b.award)return alert('未領獎勵不足');if(kind==='offset'&&amount>Math.min(b.award,b.due))return alert('未領獎勵或未付款餘額不足');if(kind==='depositOut'&&amount>b.deposit)return alert('寄存餘額不足');if(kind==='depositToDue'&&amount>Math.min(b.deposit,b.due))return alert('寄存款或未付款餘額不足');if(kind==='payment'&&amount>b.due)return alert('付款金額超過尚未支付，請分別登記寄存');const source=$('source').value.trim();if(['due','prize','jp'].includes(kind)&&!source)return alert('賽事／JP 來源不可留空');if(['due','prize','jp'].includes(kind)&&db.entries.some(x=>x.playerId===selected&&x.kind===kind&&x.source===source))return alert('同一玩家、類型與來源已存在測試紀錄，請確認是否重複');if(!confirm('確認新增 '+kinds[kind]+' '+fmt(amount)+' 元？'))return;db.entries.push({id:crypto.randomUUID(),playerId:selected,date:$('date').value,kind,amount,source,memo:$('memo').value.trim()});save();$('amount').value='';$('memo').value='';$('message').textContent='已儲存於本機測試資料（尚未寫入 Firebase）';render()};$('rows').onclick=e=>{const id=e.target?.dataset?.delete;if(!id)return;if(!confirm('確認刪除這筆測試紀錄？'))return;db.entries=db.entries.filter(x=>x.id!==id);save();render()};$('removeDemo').onclick=()=>{if(!confirm('將清空此瀏覽器全部玩家記帳測試資料，確定？'))return;if(!confirm('再次確認：這項操作不可復原。'))return;db={players:[],entries:[]};selected='';save();render()};render()})();</script></body></html>
