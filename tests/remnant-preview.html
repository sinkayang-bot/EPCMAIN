<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 餘獸獵殺｜隔離測試版</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#101b2b;color:#f5f5f5;margin:0;padding:20px}main{max-width:1000px;margin:auto}.card{background:#1d2b40;border:1px solid #3a4e67;border-radius:14px;padding:18px;margin:14px 0}h1{color:#f3c76a}button,select,input{padding:10px;border-radius:7px;border:1px solid #8292a4;font:inherit}button{background:#c69b40;color:#111;font-weight:bold;cursor:pointer}button.danger{background:#9e3434;color:white}select,input{background:#f8fafc;color:#142235}label{display:block;margin:9px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #42556e;text-align:left}small,.muted{color:#aebccc}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>label{flex:1;min-width:170px}strong{color:#ffcf6c}.pill{padding:5px 10px;background:#334963;border-radius:20px}.bar{height:16px;background:#42546a;border-radius:10px;overflow:hidden}.bar div{background:#e4a741;height:100%}</style></head><body><main><h1>EPC｜餘獸獵殺戰</h1><p class="pill">獨立測試環境｜只儲存在此瀏覽器｜不連接正式會員、賽事、帳務及活動資料庫</p><div class="card"><label>測試週期 <select id="week"><option value="0">10/11–10/17</option><option value="1">10/18–10/24</option><option value="2">10/25–10/31</option></select></label><h2 id="monster"></h2><div class="bar"><div id="hpbar"></div></div><p id="stats"></p></div><div class="card"><h2>模擬攻擊登記</h2><div class="row"><label>測試玩家名稱<input id="name" placeholder="例如：測試玩家 A" maxlength="40"></label><label>攻擊形式<select id="hand"><option value="10Xo">10Xo（平日）</option><option value="10X">10X（假日）</option><option value="TT">TT 暴擊</option></select></label></div><label><input id="verified" type="checkbox"> 已確認攻擊資格（本頁僅模擬，不核對實際手牌）</label><label>手動輸入傷害 <select id="damage"><option value="10">10 點</option><option value="20">20 點</option><option value="30">30 點</option><option value="instant">一擊必殺</option></select></label><button id="attack">登記傷害</button><p id="result"></p><small>手動選擇傷害，不再隨機抽取。TT 普通傷害 ×1.5；一擊必殺固定50分。一般擊殺額外+10分。</small></div><div class="card"><h2>本週排行榜</h2><table><thead><tr><th>排名</th><th>玩家</th><th>分數</th><th>擊殺</th><th>攻擊次數</th></tr></thead><tbody id="ranking"></tbody></table><p id="awards"></p><small>第1名 5,000元、第2名 1,000元折價卡、第3名 500元折價卡；首位個人擊殺3隻 500元、6隻 1,000元（各限一名）。此頁不會發放獎勵。</small></div><div class="card"><h2>測試攻擊紀錄</h2><table><thead><tr><th>時間</th><th>玩家</th><th>傷害</th><th>分數</th><th>擊殺</th></tr></thead><tbody id="history"></tbody></table><p><button class="danger" id="clear">清空目前週期測試紀錄</button></p></div></main><script>(()=>{'use strict';const key='epc-remnant-preview-only-v1';const $=id=>document.getElementById(id);let data;try{data=JSON.parse(localStorage.getItem(key))||[[],[],[]]}catch(e){data=[[],[],[]]}if(!Array.isArray(data)||data.length!==3)data=[[],[],[]];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(data));function calc(){let hp=100,monster=1,users=new Map(),awards={3:null,6:null},hist=[];for(const a of data[+$('week').value]){let u=users.get(a.name);if(!u){u={name:a.name,points:0,kills:0,count:0};users.set(a.name,u)}const kill=a.instant||a.damage>=hp;const pts=a.instant?50:a.damage+(kill?10:0);u.points+=pts;u.count++;if(kill){u.kills++;for(const n of [3,6])if(u.kills===n&&!awards[n])awards[n]=a.name}hist.push({...a,kill,pts,monster});if(kill){hp=100;monster++}else hp-=a.damage}return {hp,monster,rank:[...users.values()].sort((a,b)=>b.points-a.points||b.kills-a.kills),awards,hist}}function render(){const c=calc();$('monster').textContent='第 '+c.monster+' 隻小怪｜剩餘 '+c.hp+'/100 HP';$('hpbar').style.width=c.hp+'%';$('stats').textContent='本週參與獵人：'+c.rank.length+' 人｜累計攻擊：'+c.hist.length+' 次';$('ranking').innerHTML=c.rank.map((u,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(u.name)+'</td><td>'+u.points+'</td><td>'+u.kills+'</td><td>'+u.count+'</td></tr>').join('')||'<tr><td colspan="5">尚無攻擊</td></tr>';$('awards').textContent='首位擊殺3隻：'+(c.awards[3]||'尚未達成')+'｜首位擊殺6隻：'+(c.awards[6]||'尚未達成');$('history').innerHTML=c.hist.slice().reverse().map(a=>'<tr><td>'+esc(a.at)+'</td><td>'+esc(a.name)+'</td><td>'+(a.instant?'一擊必殺':a.damage)+'</td><td>'+a.pts+'</td><td>'+(a.kill?'第'+a.monster+'隻':'否')+'</td></tr>').join('')||'<tr><td colspan="5">尚無紀錄</td></tr>'}$('attack').onclick=()=>{const name=$('name').value.trim();if(!name)return alert('請輸入測試玩家名稱');if(!$('verified').checked)return alert('請先勾選已確認攻擊資格');const result=$('damage').value,instant=result==='instant',damage=instant?0:Math.floor(result*($('hand').value==='TT'?1.5:1));data[+$('week').value].push({name,hand:$('hand').value,instant,damage,at:new Date().toLocaleString('zh-TW')});save();render();$('result').textContent='本次結果：'+(instant?'一擊必殺！':damage+' 點傷害')};$('week').onchange=()=>{$('result').textContent='';render()};$('clear').onclick=()=>{if(confirm('確定清空本週所有測試攻擊？')){data[+$('week').value]=[];save();render()}};render()})();</script></body></html>
