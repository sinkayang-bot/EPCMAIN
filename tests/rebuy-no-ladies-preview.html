<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EPC Mobile｜工作人員賽事管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d121b;color:#eff3f9;font-family:system-ui,'Microsoft JhengHei',sans-serif}header{position:sticky;top:0;background:#151e2c;padding:16px;z-index:3;border-bottom:1px solid #334155}h1{font-size:22px;margin:0 0 8px}main{max-width:760px;margin:auto;padding:16px}#status,.meta{font-size:14px;color:#b7c5d7;line-height:1.5}select,input,button{font:inherit;border-radius:10px;padding:13px;border:1px solid #45556c}select,input{background:#111b29;color:white;width:100%}select{margin:16px 0}button{background:#dcbc72;color:#131b26;font-weight:700;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0 6px}.card{padding:16px;background:#1b2636;border:1px solid #34455e;border-radius:14px;margin-bottom:12px}.name{font-weight:700;font-size:20px}.controls{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-top:10px}.message{min-height:24px;font-size:14px;margin-top:8px}.error{color:#ffabab}.good{color:#99dfb5}.toolbar{display:flex;gap:8px;margin-top:10px}#summary{position:sticky;top:var(--phone-header-height,90px);z-index:2;margin-bottom:14px;background:#0d121b;padding-top:8px;padding-bottom:8px;box-shadow:0 8px 16px #0d121b}.empty{padding:20px;text-align:center;color:#b7c5d7}
.chip-summary{padding:16px;background:#1b2636;border:1px solid #34455e;border-radius:14px}.chip-totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:14px;color:#b7c5d7}.chip-totals strong{display:block;font-size:24px;color:#eff3f9;margin-top:4px;overflow-wrap:anywhere}.chip-gap{font-size:24px;font-weight:800;margin-top:12px}.chip-preview{border-top:1px solid #45556c;padding-top:12px;margin-top:12px;line-height:1.7;font-size:18px}
h2{font-size:18px;margin:0 0 12px}#registration button{width:100%;margin-top:12px}#registration select{margin:6px 0}.toolbar button{flex:1}#entrySummary{font-size:16px;line-height:1.8}</style><style id="epcMobileDashboard">
body{background:#0b111a}header{background:#111c2a;border-bottom:1px solid #263b51}h1{color:#e6bc59;font-size:21px}main{max-width:640px}
.mobile-hero{padding:17px;background:#1b2b3b;border:1px solid #35485d;border-radius:17px;margin:12px 0}
.mobile-hero h2{font-size:18px;margin:0 0 9px}
.mobile-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mobile-kpis>div{font-size:12px;color:#aebed0}.mobile-kpis strong{display:block;color:#fff;font-size:23px;margin-top:5px}
.mobile-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.mobile-tile{background:#25364a;color:#f6f8fc;border:1px solid #344960;min-height:112px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;font-size:17px;font-weight:750;padding:12px}
.mobile-tile .tile-icon{font-size:27px;color:#e7ba4c}
.mobile-tile.active{border-color:#e0b756;background:#344458}
.mobile-panel[hidden],#dashboard[hidden]{display:none!important}
.mobile-back{background:#26374a;color:#fff;margin-bottom:12px;padding:10px 14px}
#players .card{margin-bottom:12px}
#mobileOverview{display:none}
#summary{position:sticky;top:var(--phone-header-height,90px);z-index:8;box-shadow:0 8px 18px #0b111acc;background:#0b111a;padding:6px 0 8px}#playerPanel #summary .chip-summary{padding:10px 14px}#playerPanel #summary .chip-totals{margin-top:6px}#playerPanel #summary .chip-totals strong{font-size:18px}#playerPanel #summary .chip-gap{font-size:23px;margin-top:6px}.member-results{display:grid;gap:5px;max-height:250px;overflow:auto;margin:8px 0}.member-result{background:#283b51;color:#fff;text-align:left;font-size:14px;padding:11px;border-radius:9px}.member-result:focus{outline:2px solid #e4b956}#memberChosen{color:#e4b956;font-weight:700;margin:8px 0}#memberSelect[hidden]{display:none}
.seat-roster{display:flex;gap:8px;overflow-x:auto;padding:10px 0 15px}.seat-person{flex:0 0 auto;background:#30475e;color:#fff;border:1px solid #4b6179;border-radius:10px;padding:9px 12px;font-size:13px;touch-action:pan-y}.seat-person.picked{background:#80652e;border-color:#e6bc59}.seat-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.seat-table{background:#1b2b3b;border:1px solid #35495e;border-radius:15px;padding:10px}.seat-table h3{font-size:15px;color:#e6bc59;margin:0 0 9px}.seat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.seat-slot{background:#12202e;border:1px solid #43556a;color:#d9e3ee;border-radius:8px;min-height:59px;padding:6px 3px;font-size:11px;overflow-wrap:anywhere;touch-action:pan-y}.seat-slot.occupied{background:#30445b;color:#fff}.seat-slot.target{border-color:#e6bc59;background:#3c4b45}.seat-slot.picked{border:2px solid #e6bc59}@media(max-width:400px){.seat-tables{gap:8px}.seat-table{padding:7px}.seat-slot{font-size:10px}} .seat-sticky{position:sticky;top:var(--phone-header-height,90px);z-index:2;background:#0b111a;padding:10px 0 8px;border-bottom:1px solid #35495e;margin-bottom:12px}.seat-sticky h3{margin:0 0 5px;font-size:16px}.seat-roster{margin:0;max-height:105px;overflow-y:auto;flex-wrap:wrap;align-content:flex-start}.seat-roster:empty{display:none}.seat-sticky .meta{font-size:12px;margin:4px 0}.seat-person{min-height:38px}.seat-slot.picked{border:2px solid #e6bc59}.seat-table h3{user-select:none;-webkit-user-select:none;touch-action:none}.seat-table{min-width:0}</style><style id="epcMobileNavigationFix">.overview-shortcut{display:block;width:100%;margin:12px 0 0;background:#263b51;color:#f7d887;border:1px solid #b99042;min-height:64px;font-size:19px}.floating-back{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;background:#dcbc72;color:#101822;box-shadow:0 5px 20px #0009;padding:14px 20px;border-radius:999px;min-height:50px}.floating-back[hidden]{display:none!important}
.floating-back{right:0!important;bottom:calc(100px + env(safe-area-inset-bottom))!important;border-radius:14px 0 0 14px!important;padding:11px 9px!important;min-height:44px!important;font-size:13px!important;opacity:.78;max-width:76px;touch-action:manipulation}
.floating-back:focus-visible{opacity:1;outline:2px solid #fff}
body:has(input:focus) .floating-back,body:has(textarea:focus) .floating-back,body:has(select:focus) .floating-back{display:none!important}
@media(max-width:430px){.floating-back{max-width:62px;font-size:12px!important;padding:10px 6px!important}}
.mobile-panel{padding-bottom:85px}#chipTableSelect{margin:4px 0 14px}.overview-person{width:100%;text-align:left;background:#24374a;color:#f4f7fc;border:1px solid #445b70;margin:5px 0;padding:14px}.overview-person small{display:block;color:#bed0e2;margin-top:5px;font-size:13px}.overview-person:focus-visible{outline:2px solid #e6bc59}.overview-player-title{margin:16px 0 9px}.unpaid-player{color:#ff9292!important}.payment-badge{display:block;font-weight:700;margin-top:5px}.payment-badge.clear{color:#dce9ee}.payment-badge.unpaid{color:#ff9292}#mobilePaymentRetry{margin-top:10px;background:#e7aa67}#phonePaymentAuth .toolbar{flex-wrap:wrap}</style></head><body><header><h1>EPC MOBILE｜重買驗證</h1><div>獨立練習資料，不會變更正式帳務</div></header><main><section id="rebuyPanel" class="card mobile-panel"><h2>重買</h2><p class="meta">選擇已報名玩家並輸入新增重買組數。確認後同步到賽事。</p><label for="rebuyPlayer">選擇玩家</label><select id="rebuyPlayer"><option value="female">女性玩家｜已使用報名女士優惠</option><option value="regular">一般玩家</option></select><label for="rebuyGroups">新增重買組數</label><input id="rebuyGroups" type="number" min="1" max="100" step="1" value="1"><p class="meta">重買不適用女士優惠；如需折扣，請輸入本次手動優惠。</p><label for="rebuyManualDiscount">本次手動優惠（元）</label><input id="rebuyManualDiscount" type="number" min="0" step="1" value="0"><div id="rebuyPriceNote" class="meta"></div><label style="display:flex;align-items:center;gap:9px;margin:12px 0"><input id="rebuyUnpaid" type="checkbox" style="width:auto;min-width:18px;height:18px"> 本次重買尚未付款（預設已付款，未收款才勾選）</label><button id="rebuySaveBtn" type="button">確認重買並儲存</button><div id="rebuyMessage" class="message"></div></section></main><script type="module">import {rebuyPrice} from '../player-pricing.js?v=20261023-rebuy-no-ladies30';const $=id=>document.getElementById(id);const event={buyin:3000,fee:400,ladiesDiscount:200};function update(){const p={buyin:1,rebuy:1,ladies:$('rebuyPlayer').value==='female',manualDiscount:0};try{const cost=rebuyPrice(event,p,Number($('rebuyGroups').value),Number($('rebuyManualDiscount').value));$('rebuyPriceNote').textContent='本次應付 '+cost.amount.toLocaleString()+' 元｜報名女士優惠保留，重買不再套用';}catch(e){$('rebuyPriceNote').textContent=e.message}}for(const id of ['rebuyPlayer','rebuyGroups','rebuyManualDiscount'])$(id).addEventListener('input',update);$('rebuySaveBtn').onclick=()=>{$('rebuyMessage').textContent='驗證頁不會儲存正式帳務。'};update();</script></body></html>
