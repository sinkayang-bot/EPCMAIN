name: Publish EPC public activity catalog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: epc-public-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save firebase-admin@13
      - name: Publish sanitized activity rankings
        run: node activity-lookup/publish-catalog.server.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
