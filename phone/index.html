<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EPC Mobile｜工作人員賽事管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d121b;color:#eff3f9;font-family:system-ui,'Microsoft JhengHei',sans-serif}header{position:sticky;top:0;background:#151e2c;padding:16px;z-index:3;border-bottom:1px solid #334155}h1{font-size:22px;margin:0 0 8px}main{max-width:760px;margin:auto;padding:16px}#status,.meta{font-size:14px;color:#b7c5d7;line-height:1.5}select,input,button{font:inherit;border-radius:10px;padding:13px;border:1px solid #45556c}select,input{background:#111b29;color:white;width:100%}select{margin:16px 0}button{background:#dcbc72;color:#131b26;font-weight:700;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0 6px}.card{padding:16px;background:#1b2636;border:1px solid #34455e;border-radius:14px;margin-bottom:12px}.name{font-weight:700;font-size:20px}.controls{display:grid;grid-template-columns:1fr 90px;gap:10px;margin-top:10px}.message{min-height:24px;font-size:14px;margin-top:8px}.error{color:#ffabab}.good{color:#99dfb5}.toolbar{display:flex;gap:8px;margin-top:10px}#summary{position:sticky;top:var(--phone-header-height,90px);z-index:2;margin-bottom:14px;background:#0d121b;padding-top:8px;padding-bottom:8px;box-shadow:0 8px 16px #0d121b}.empty{padding:20px;text-align:center;color:#b7c5d7}
.chip-summary{padding:16px;background:#1b2636;border:1px solid #34455e;border-radius:14px}.chip-totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:14px;color:#b7c5d7}.chip-totals strong{display:block;font-size:24px;color:#eff3f9;margin-top:4px;overflow-wrap:anywhere}.chip-gap{font-size:24px;font-weight:800;margin-top:12px}.chip-preview{border-top:1px solid #45556c;padding-top:12px;margin-top:12px;line-height:1.7;font-size:18px}
h2{font-size:18px;margin:0 0 12px}#registration button{width:100%;margin-top:12px}#registration select{margin:6px 0}.toolbar button{flex:1}#entrySummary{font-size:16px;line-height:1.8}</style><style id="epcMobileDashboard">
body{background:#0b111a}header{background:#111c2a;border-bottom:1px solid #263b51}h1{color:#e6bc59;font-size:21px}main{max-width:640px}
.mobile-hero{padding:17px;background:#1b2b3b;border:1px solid #35485d;border-radius:17px;margin:12px 0}
.mobile-hero h2{font-size:18px;margin:0 0 9px}
.mobile-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mobile-kpis>div{font-size:12px;color:#aebed0}.mobile-kpis strong{display:block;color:#fff;font-size:23px;margin-top:5px}
.mobile-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.mobile-tile{background:#25364a;color:#f6f8fc;border:1px solid #344960;min-height:112px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;font-size:17px;font-weight:750;padding:12px}
.mobile-tile .tile-icon{font-size:27px;color:#e7ba4c}
.mobile-tile.active{border-color:#e0b756;background:#344458}
.mobile-panel[hidden],#dashboard[hidden]{display:none!important}
.mobile-back{background:#26374a;color:#fff;margin-bottom:12px;padding:10px 14px}
#players .card{margin-bottom:12px}
#mobileOverview{display:none}
#summary{position:static;box-shadow:none}
</style></head><body><header><h1>EPC MOBILE｜賽事管理</h1><div id="status">正在讀取最新賽事…</div></header><main><label for="eventSelect">進行中賽事</label><select id="eventSelect"></select><div class="toolbar"><button id="reload">重新讀取</button></div><section id="dashboard"><div class="mobile-hero"><div class="meta">目前選取賽事</div><h2 id="dashEventName">讀取中…</h2><div class="mobile-kpis"><div>參賽<strong id="dashPlayers">—</strong></div><div>重買<strong id="dashRebuys">—</strong></div><div>總組數<strong id="dashGroups">—</strong></div></div></div><div class="mobile-menu"><button class="mobile-tile" data-panel="registration"><span class="tile-icon">♙</span>玩家報名</button><button class="mobile-tile" data-panel="rebuyPanel"><span class="tile-icon">▤</span>買入／重買</button><button class="mobile-tile" data-panel="playerPanel"><span class="tile-icon">▣</span>桌位管理</button><button class="mobile-tile" data-panel="playerPanel"><span class="tile-icon">◉</span>籌碼登記</button><button class="mobile-tile" data-panel="playerPanel"><span class="tile-icon">◎</span>人頭紀錄</button><button class="mobile-tile" data-panel="overviewPanel"><span class="tile-icon">▥</span>賽事總覽</button></div></section><button id="backDashboard" class="mobile-back" hidden>← 返回賽事首頁</button><section class="card mobile-panel" id="registration" hidden><h2>玩家報名</h2><label for="memberSearch">搜尋會員姓名／綽號／編號</label><input id="memberSearch" autocomplete="off" placeholder="輸入關鍵字"><label for="memberSelect">選擇會員</label><select id="memberSelect"><option value="">正在載入會員…</option></select><label for="buyinGroups">首次買入組數</label><input id="buyinGroups" type="number" min="1" max="100" step="1" value="1"><label for="birdType">優惠類型</label><select id="birdType"><option value="none">無優惠</option><option value="early">早鳥</option><option value="late">晚鳥</option></select><label for="amountPaid">應收金額（元，可修改）</label><input id="amountPaid" type="number" min="0" step="1"><p class="meta" id="priceNote">金額依賽事規則自動帶入；修改金額將記為手動優惠。</p><button id="registerBtn" type="button">確認報名並儲存</button><div class="message" id="registerMessage"></div></section><section id="rebuyPanel" class="card mobile-panel" hidden><h2>買入／重買</h2><p class="meta">請先在玩家報名完成首次買入。既有玩家重買功能需使用與 V3 相同的安全寫入規則，尚未開放修改，避免錯帳。</p></section><section id="playerPanel" class="mobile-panel" hidden><h2>玩家操作</h2><p class="meta">填寫座位、下桌籌碼或本場累計人頭後按「儲存」。人頭每個計1分，連動獵人排行榜。儲存成功後電腦會自動收到更新；0 代表已無籌碼。</p><div id="summary"></div><div id="players"></div></section><section id="overviewPanel" class="mobile-panel" hidden><h2>賽事總覽</h2><div id="overviewStats" class="card"></div></section><div class="card" id="mobileOverview"><h2>本場賽事總覽</h2><div id="entrySummary" class="meta"></div></div></main><script src="../firebase-config.js"></script><script src="stack-core.js?v=20261009-chip-difference"></script><script type="module" src="phone.js?v=20261009-mobile-dashboard-v1"></script></body></html>
