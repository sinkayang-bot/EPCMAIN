<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 賽事計時器</title><style>body{background:#050505;color:white;font:20px Arial,"Microsoft JhengHei";margin:0;text-align:center}header{padding:20px;background:#171717;color:#dfbc67;font-weight:bold}main{padding:24px}.layout{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:18px;align-items:center}.panel{background:#111;border:1px solid #444;border-radius:16px;padding:20px}.label{color:#aaa;font-size:18px}.big{font-size:clamp(28px,4vw,64px);font-weight:bold;color:#dfbc67;margin:20px 0}.clock{border:12px solid #dfbc67;box-shadow:0 0 28px #b38c35;border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column}.time{font-size:clamp(48px,7vw,112px);font-weight:900;font-variant-numeric:tabular-nums}button{background:#292929;color:white;border:1px solid #777;border-radius:8px;padding:12px 20px;margin:8px;cursor:pointer;font-size:17px}.gold{background:#dfbc67;color:black}details{margin-top:25px;text-align:left;background:#151515;padding:18px;border-radius:12px}summary{cursor:pointer;color:#dfbc67}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #444;padding:6px}input{width:95%;padding:8px;background:#222;color:white;border:1px solid #666}input[type=checkbox]{width:auto}@media(max-width:850px){.layout{grid-template-columns:1fr}.clock{max-width:350px;margin:auto}.layout .panel:nth-child(2){grid-row:1}}:fullscreen main{max-width:none}.hint{color:#aaa;font-size:15px}</style><header>EPC POKER MANAGEMENT｜賽事計時器</header><main><div class="layout"><section class="panel"><div class="label">目前盲注</div><div id="current" class="big"></div><div class="label">前注</div><div id="ante" class="big"></div></section><section class="panel"><div class="clock"><div id="level" class="label"></div><div id="time" class="time">20:00</div><div id="status" class="label">準備開始</div></div></section><section class="panel"><div class="label">下一級盲注</div><div id="next" class="big"></div><div class="label">下一級前注</div><div id="nextante" class="big"></div></section></div><p><button id="play" class="gold">開始</button><button id="prev">上一級</button><button id="advance">下一級</button><button id="reset">重設本級</button><button id="full">全螢幕</button></p><p class="hint">獨立計時器，不會修改會員、賽事或帳務資料；設定僅儲存在目前瀏覽器。</p><details><summary>編輯盲注級別、每級分鐘數與休息時間</summary><table><thead><tr><th>級別</th><th>小盲</th><th>大盲</th><th>前注</th><th>分鐘</th><th>休息</th></tr></thead><tbody id="rows"></tbody></table><button id="add">新增級別</button><button id="remove">刪除末級</button><button id="save" class="gold">儲存設定</button></details></main><script>
const $=x=>document.getElementById(x),key='epc_timer_settings_v1';let levels=[[100,200,200,20,false],[200,400,400,20,false],[300,600,600,20,false],[0,0,0,5,true],[400,800,800,20,false],[500,1000,1000,20,false],[600,1200,1200,20,false],[0,0,0,5,true],[800,1600,1600,20,false]],idx=0,left=1200,playing=false,deadline=0;
try{const v=JSON.parse(localStorage.getItem(key));if(v&&v.levels?.length){levels=v.levels;idx=Math.min(v.idx||0,levels.length-1);left=v.left??levels[idx][3]*60}}catch(e){}
function store(){localStorage.setItem(key,JSON.stringify({levels,idx,left}))}
function show(){const c=levels[idx],n=levels[idx+1],format=x=>x?x[4]?'休息':x[0].toLocaleString()+' / '+x[1].toLocaleString():'結束';$('current').textContent=format(c);$('ante').textContent=c[4]?'—':c[2].toLocaleString();$('next').textContent=format(n);$('nextante').textContent=n&&!n[4]?n[2].toLocaleString():'—';$('level').textContent=c[4]?'休息時間':'LEVEL '+(idx+1);$('time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('status').textContent=playing?'計時中':'已暫停';$('play').textContent=playing?'暫停':'開始'}
function pause(){if(playing){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));playing=false}store();show()}
function move(d){pause();idx=Math.max(0,Math.min(levels.length-1,idx+d));left=levels[idx][3]*60;store();show()}
$('play').onclick=()=>{if(playing)return pause();if(left<=0)left=levels[idx][3]*60;deadline=Date.now()+left*1000;playing=true;show()};
$('prev').onclick=()=>move(-1);$('advance').onclick=()=>move(1);$('reset').onclick=()=>{pause();left=levels[idx][3]*60;store();show()};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};
setInterval(()=>{if(!playing)return;let n=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(n===left)return;left=n;if(!n){playing=false;if(idx<levels.length-1){idx++;left=levels[idx][3]*60}}if(!playing||left%5===0)store();show()},200);
function edit(){ $('rows').innerHTML=levels.map((r,i)=>'<tr><td>'+(i+1)+'</td>'+r.map((v,j)=>'<td><input data-j="'+j+'" type="'+(j===4?'checkbox':'number')+'" '+(j===4?(v?'checked':''):'min="0" value="'+v+'")+'></td>').join('')+'</tr>').join('')}
function read(){levels=[...$('rows').querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('input')].map(x=>x.type==='checkbox'?x.checked:Math.max(0,Number(x.value)||0)));levels.forEach(x=>x[3]=Math.max(1,x[3]))}
$('add').onclick=()=>{read();levels.push([0,0,0,20,false]);edit()};$('remove').onclick=()=>{if(levels.length<2)return;read();levels.pop();edit()};$('save').onclick=()=>{pause();read();idx=Math.min(idx,levels.length-1);left=levels[idx][3]*60;store();edit();show();alert('設定已儲存')};window.addEventListener('beforeunload',()=>{if(playing)left=Math.max(0,Math.ceil((deadline-Date.now())/1000));store()});edit();show();
</script></html>
