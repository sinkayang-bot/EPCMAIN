<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPC 暫停音效試聽</title><style>body{background:#0c0d10;color:#f4d38a;font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#191b21;border:1px solid #8c713b;border-radius:20px;padding:40px;text-align:center;max-width:420px;width:80%}button{font-size:23px;background:#d6ad58;border:0;border-radius:12px;padding:18px 28px;cursor:pointer;color:#151515;font-weight:800}p{color:#ccc}</style></head><body><div class="card"><h1>Ⅱ 暫停提示音</h1><p>低沉雙音・約 0.5 秒</p><button id="play">▶ 試聽暫停音效</button><p id="status">按下按鈕即可播放</p></div><script>let ctx;document.getElementById('play').onclick=async()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const t=ctx.currentTime+.03;for(const [i,hz] of [660,440].entries()){const o=ctx.createOscillator(),g=ctx.createGain(),at=t+i*.24;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.25,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+.2);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+.21)}document.getElementById('status').textContent='已播放，可重複試聽';};</script></body></html>
