<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>EPC 提示音試聽選單</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f1e8;font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}main{max-width:1080px;margin:auto;padding:36px 24px 150px}h1{font-size:30px;margin:0;color:#efce78}p{color:#bcb8af;margin:8px 0 24px}h2{font-size:21px;margin:30px 0 12px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.voice{border:1px solid #51452b;border-radius:12px;background:#151411;padding:16px}.voice.selected{border-color:#efce78;background:#2a2416;box-shadow:0 0 0 1px #efce78}.code{color:#efce78;font-weight:800;font-size:23px}.name{min-height:42px;margin:4px 0 12px;font-size:15px}button{font:inherit;cursor:pointer;border:1px solid #826a37;background:#252014;color:#f8e5b4;border-radius:7px;padding:9px 12px}button:hover{background:#40331b}.play{width:100%;margin-bottom:12px}.choose{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}input{accent-color:#efce78}.bar{position:fixed;bottom:0;left:0;right:0;background:#111e;border-top:1px solid #61502e;padding:15px 24px;backdrop-filter:blur(12px)}.barinner{max-width:1032px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}#selection{font-size:18px;color:#efce78;font-weight:700}#status{min-height:26px;color:#c9c4b8;font-size:14px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}#volume{width:150px}.note{font-size:14px;color:#aaa}@media(max-width:760px){.choices{grid-template-columns:repeat(2,1fr)}main{padding:24px 16px 190px}h1{font-size:25px}.bar{padding:12px 16px}.name{min-height:24px}}
</style><main><h1>EPC 提示音試聽</h1><p>音調較高的 20 款聲音。每類選一款，選好後把下方編號回覆給我，再套用到計時器。</p><div class="controls"><button id="stop">停止播放</button><label>試聽音量 <input id="volume" type="range" min="20" max="100" step="5" value="75" aria-label="試聽音量"> <output id="volumeValue">75%</output></label></div><div class="note">換級別是鐘聲自然延音；結束警報是一次持續 2 秒的緊急警笛。這裡的選擇不會修改現場賽事。</div><div id="groups"></div></main><div class="bar"><div class="barinner"><div><div id="selection">尚未選擇</div><div id="status" role="status">點「播放」開始試聽</div></div><button id="copy">複製選擇編號</button></div></div><script type="module">
import {soundGroups,scheduleVoice} from './timer-sound-options.js?v=20261022-emergency18';
const alarmOnly=new URLSearchParams(location.search).get('category')==='end',groups=alarmOnly?soundGroups.filter(g=>g.key==='end'):soundGroups;
if(alarmOnly){document.querySelector('h1').textContent='EPC 緊急出動警報試聽';document.querySelector('main>p').textContent='5 款全新緊急出動風格，每款持續 2 秒。選好後回覆 E1～E5，我再套用到最後結束警報。';document.querySelector('.note').textContent='已確認：10 秒 A1 一聲、5 秒 A1 一聲、換級別 C3。此頁僅試聽，不會修改現場賽事。';}
let context,nodes=[],playingButton,playId=0;const chosen={},host=document.getElementById('groups'),status=document.getElementById('status');
function stop(){playId++;nodes.forEach(n=>{try{n.stop()}catch(_){}});nodes=[];if(playingButton)playingButton.textContent='▶ 播放';playingButton=null;}
function update(){document.getElementById('selection').textContent=groups.map(g=>chosen[g.key]||'—').join('、');document.querySelectorAll('.voice').forEach(el=>el.classList.toggle('selected',chosen[el.dataset.group]===el.dataset.id));}
for(const group of groups){const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=group.title;grid.className='choices';section.append(h,grid);host.append(section);
 for(const voice of group.options){const card=document.createElement('div');card.className='voice';card.dataset.id=voice.id;card.dataset.group=group.key;const code=document.createElement('div'),name=document.createElement('div'),play=document.createElement('button'),label=document.createElement('label'),radio=document.createElement('input');code.className='code';code.textContent=voice.id;name.className='name';name.textContent=voice.name;play.className='play';play.textContent='▶ 播放';play.setAttribute('aria-label','播放 '+voice.id+' '+voice.name);label.className='choose';radio.type='radio';radio.name=group.key;radio.value=voice.id;radio.setAttribute('aria-label','選擇 '+voice.id);label.append(radio,document.createTextNode('選這個'));radio.onchange=()=>{chosen[group.key]=voice.id;update();};
 play.onclick=async()=>{stop();try{context||=new (window.AudioContext||window.webkitAudioContext)();await context.resume();if(context.state!=='running')throw Error('blocked');const thisPlay=++playId,result=scheduleVoice(context,voice,Number(document.getElementById('volume').value)/100);nodes=result.nodes;playingButton=play;play.textContent='正在播放…';status.textContent='正在播放 '+voice.id+'｜'+voice.name;setTimeout(()=>{if(playingButton===play&&playId===thisPlay){play.textContent='▶ 播放';playingButton=null;status.textContent=voice.id+' 播放完畢';}},result.duration*1000);}catch(_){status.textContent='無法播放，請再次點擊播放';}};
 card.append(code,name,play,label);grid.append(card);}}
document.getElementById('stop').onclick=()=>{stop();status.textContent='已停止播放';};document.getElementById('volume').oninput=e=>document.getElementById('volumeValue').textContent=e.target.value+'%';document.getElementById('copy').onclick=async()=>{const text=groups.map(g=>g.title.split('｜')[0]+'：'+(chosen[g.key]||'未選')).join('，');try{await navigator.clipboard.writeText(text);status.textContent='已複製，貼回對話即可';}catch(_){status.textContent=text;}};
</script></html>
